<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0c10">
<title>MewAgent</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;

  --bg:#0a0c10;
  --bg-2:#0d1015;
  --bar-bg:rgba(10,12,16,.72);
  --surface:#12161d;
  --surface-2:#181d26;
  --surface-3:#1f2530;

  --text:#c9d1dd;
  --text-dim:#7f8b9e;
  --text-bright:#f1f4f9;

  --accent:#5b8cff;
  --accent-2:#8b6bff;
  --accent-soft:rgba(91,140,255,.12);
  --accent-line:rgba(91,140,255,.38);

  --green:#3ddc97;
  --red:#ff6b7a;
  --yellow:#f4b740;

  --border:rgba(255,255,255,.065);
  --border-strong:rgba(255,255,255,.12);

  --code-bg:#0c0f14;
  --user-bg:#1a2130;

  --radius:12px;
  --radius-sm:8px;

  --shadow-1:0 1px 2px rgba(0,0,0,.35);
  --shadow-2:0 12px 32px -8px rgba(0,0,0,.55);
  --shadow-3:0 24px 64px -16px rgba(0,0,0,.7);

  color-scheme:dark;
}

[data-theme="light"]{
  --bg:#f7f8fb;
  --bg-2:#f0f2f7;
  --bar-bg:rgba(255,255,255,.78);
  --surface:#ffffff;
  --surface-2:#f4f6fa;
  --surface-3:#e9edf4;

  --text:#42506a;
  --text-dim:#6b7789;
  --text-bright:#0e1626;

  --accent:#2b63f0;
  --accent-2:#7a4ef0;
  --accent-soft:rgba(43,99,240,.09);
  --accent-line:rgba(43,99,240,.28);

  --green:#0f9d58;
  --red:#d92d3f;
  --yellow:#b06a00;

  --border:rgba(14,22,38,.075);
  --border-strong:rgba(14,22,38,.15);

  --code-bg:#f3f5f9;
  --user-bg:#eef2fa;

  --shadow-1:0 1px 2px rgba(14,22,38,.06);
  --shadow-2:0 12px 28px -10px rgba(14,22,38,.18);
  --shadow-3:0 24px 60px -20px rgba(14,22,38,.22);

  color-scheme:light;
}

html,body{height:100%}

body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-sans);
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow:hidden;
  transition:background .25s ease,color .25s ease;
}

::selection{background:var(--accent-soft);color:var(--text-bright)}
button{font-family:inherit}

/* ═══ 外壳 + 环境光 ═══ */
#app{display:flex;height:100vh;position:relative;isolation:isolate}

#app::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(760px 380px at 46% -8%,rgba(91,140,255,.14),transparent 62%),
    radial-gradient(560px 320px at 94% 2%,rgba(139,107,255,.09),transparent 70%);
}
[data-theme="light"] #app::before{
  background:
    radial-gradient(720px 340px at 46% -10%,rgba(43,99,240,.10),transparent 62%),
    radial-gradient(560px 320px at 94% 0%,rgba(122,78,240,.07),transparent 70%);
}

#center{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}

/* ═══ 侧边栏 ═══ */
.sidebar{
  width:272px;flex-shrink:0;
  display:flex;flex-direction:column;
  background:var(--bg-2);
  border-right:1px solid var(--border);
  overflow:hidden;
  transition:background .25s ease;
}

.sidebar-header{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:16px 14px 10px;flex-shrink:0;
}

.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand-badge{
  width:26px;height:26px;border-radius:9px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(145deg,var(--accent),var(--accent-2));
  box-shadow:0 6px 16px -6px rgba(91,140,255,.7),inset 0 1px 0 rgba(255,255,255,.28);
}
.brand-badge svg{width:14px;height:14px}
.brand-name{
  font-size:13.5px;font-weight:600;letter-spacing:-.01em;
  color:var(--text-bright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.new-session-btn{
  display:inline-flex;align-items:center;gap:4px;flex-shrink:0;
  height:28px;padding:0 10px;border-radius:8px;
  border:1px solid var(--border-strong);
  background:var(--surface);color:var(--text);
  font-size:12px;font-weight:500;cursor:pointer;
  transition:background .15s ease,border-color .15s ease,color .15s ease,transform .1s ease;
}
.new-session-btn .plus{font-size:14px;line-height:1;color:var(--accent);font-weight:400}
.new-session-btn:hover{background:var(--surface-2);border-color:var(--accent-line);color:var(--text-bright)}
.new-session-btn:active{transform:scale(.97)}

.session-count{
  padding:2px 18px 8px;
  font-size:10.5px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--text-dim);
}

#session-list{flex:1;overflow-y:auto;padding:0 8px 12px}
#session-list::-webkit-scrollbar{width:6px}
#session-list::-webkit-scrollbar-track{background:transparent}
#session-list::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}

.session-item{
  position:relative;
  display:flex;align-items:center;gap:6px;
  padding:9px 8px 9px 11px;margin-bottom:2px;
  border-radius:9px;border:1px solid transparent;
  cursor:pointer;
  transition:background .14s ease,border-color .14s ease;
}
.session-main{flex:1;min-width:0}
.session-title{
  font-size:12.5px;font-weight:500;color:var(--text);
  line-height:1.45;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.session-meta{
  margin-top:2px;
  font-size:11px;color:var(--text-dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-variant-numeric:tabular-nums;
}
.session-item:hover{background:var(--surface)}
.session-item.active{background:var(--surface-2);border-color:var(--border)}
.session-item.active::before{
  content:'';position:absolute;left:0;top:9px;bottom:9px;width:2.5px;
  border-radius:0 3px 3px 0;
  background:linear-gradient(var(--accent),var(--accent-2));
}
.session-item.active .session-title{color:var(--text-bright)}

.session-del{
  flex-shrink:0;width:18px;height:18px;
  display:flex;align-items:center;justify-content:center;
  border:none;border-radius:5px;
  background:transparent;color:var(--text-dim);
  font-size:13px;line-height:1;padding:0;cursor:pointer;
  opacity:0;
  transition:opacity .12s ease,color .12s ease,background .12s ease;
}
.session-item:hover .session-del{opacity:1}
.session-del:hover{color:var(--red);background:rgba(255,107,122,.14)}
.session-del.armed{color:#fff;background:var(--red);opacity:1;font-size:11px}

.session-empty{
  padding:28px 14px;text-align:center;
  color:var(--text-dim);font-size:12px;line-height:1.7;
}

/* ═══ 状态栏 ═══ */
#status-bar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  height:46px;padding:0 18px;flex-shrink:0;
  background:var(--bar-bg);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(14px) saturate(1.2);
  -webkit-backdrop-filter:blur(14px) saturate(1.2);
}
.status-left{display:flex;align-items:center;gap:8px;min-width:0}
.status-mark{display:flex;flex-shrink:0;color:var(--accent);opacity:.9}
.status-mark svg{width:13px;height:13px}
#session-label{
  font-size:12px;color:var(--text-dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-variant-numeric:tabular-nums;
}
#status-bar .info{display:flex;align-items:center;gap:10px;flex-shrink:0}

.usage-meter{
  display:inline-flex;align-items:center;gap:9px;
  height:24px;padding:0 9px;border-radius:7px;
  border:1px solid var(--border);background:var(--surface);
  font-family:var(--font-mono);font-size:11px;color:var(--text-dim);
}
.usage-item{display:inline-flex;align-items:center;gap:4px}
.usage-k{font-family:var(--font-sans);font-size:10.5px;letter-spacing:.02em}
.usage-v{color:var(--text);font-variant-numeric:tabular-nums}
.usage-sep{width:1px;height:10px;background:var(--border-strong)}

.conn-status{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;color:var(--text-dim);white-space:nowrap;
}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dot.connected{background:var(--green);box-shadow:0 0 0 3px rgba(61,220,151,.14)}
.dot.disconnected{background:var(--red);box-shadow:0 0 0 3px rgba(255,107,122,.14)}

.theme-toggle{
  display:inline-flex;align-items:center;gap:2px;padding:2px;
  border-radius:8px;border:1px solid var(--border);background:var(--surface);
}
.theme-btn{
  width:26px;height:22px;
  display:inline-flex;align-items:center;justify-content:center;
  border:none;border-radius:6px;background:transparent;
  color:var(--text-dim);cursor:pointer;
  transition:background .14s ease,color .14s ease;
}
.theme-btn svg{width:13px;height:13px}
.theme-btn:hover{color:var(--text-bright)}
.theme-btn.active{background:var(--surface-3);color:var(--text-bright)}

/* ═══ 消息区 ═══ */
#messages{
  flex:1;overflow-y:auto;overscroll-behavior:contain;
  padding:26px max(24px,calc((100% - 820px)/2)) 20px;
  scroll-behavior:smooth;
}
#messages::-webkit-scrollbar{width:10px}
#messages::-webkit-scrollbar-track{background:transparent}
#messages::-webkit-scrollbar-thumb{
  background:var(--border-strong);border-radius:5px;
  border:3px solid transparent;background-clip:content-box;
}
#messages::-webkit-scrollbar-thumb:hover{background:var(--text-dim);border:3px solid transparent;background-clip:content-box}

/* ── 欢迎引导 ── */
.welcome{
  display:flex;justify-content:center;
  padding:clamp(40px,13vh,140px) 16px 48px;
  animation:fadeUp .4s ease both;
}
.welcome-card{max-width:560px;width:100%;text-align:center}
.welcome-icon{
  width:56px;height:56px;margin:0 auto 20px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(145deg,var(--accent),var(--accent-2));
  box-shadow:0 18px 44px -14px rgba(91,140,255,.6),inset 0 1px 0 rgba(255,255,255,.25);
}
.welcome-icon svg{width:26px;height:26px}
.welcome-card h2{
  font-size:24px;font-weight:650;letter-spacing:-.02em;
  color:var(--text-bright);margin-bottom:8px;
}
.welcome-card p{
  font-size:13.5px;line-height:1.7;color:var(--text-dim);
  margin-bottom:26px;
}
.welcome-tips{
  display:grid;grid-template-columns:1fr;gap:8px;
  max-width:420px;margin:0 auto;
}
.welcome-tips button{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 14px;border-radius:10px;
  border:1px solid var(--border);background:var(--surface);
  color:var(--text);font-family:inherit;font-size:13px;text-align:left;
  cursor:pointer;
  transition:background .15s ease,border-color .15s ease;
}
.welcome-tips button::after{
  content:'→';flex-shrink:0;
  color:var(--text-dim);font-size:13px;
  transition:transform .15s ease,color .15s ease;
}
.welcome-tips button:hover{background:var(--surface-2);border-color:var(--accent-line)}
.welcome-tips button:hover::after{color:var(--accent);transform:translateX(2px)}

/* ── 用户消息 ── */
.msg-user{display:flex;justify-content:flex-end;margin-bottom:22px}
.msg-user .bubble{
  max-width:74%;padding:10px 15px;
  background:var(--user-bg);
  border:1px solid var(--border);
  border-radius:14px 14px 4px 14px;
  box-shadow:var(--shadow-1);
  color:var(--text-bright);line-height:1.62;font-size:14px;
  white-space:pre-wrap;word-break:break-word;
}

/* ── 助手消息 ── */
.msg-assistant{display:flex;justify-content:flex-start;margin-bottom:28px}
.msg-assistant .bubble{
  max-width:100%;padding:0;
  background:transparent;border:none;
  color:var(--text);line-height:1.78;font-size:14.5px;
  word-break:break-word;
}
.msg-assistant .bubble p{margin-bottom:12px}
.msg-assistant .bubble p:last-child{margin-bottom:0}
.msg-assistant .bubble code{
  background:var(--surface-2);padding:2px 6px;border-radius:5px;
  border:1px solid var(--border);
  font-family:var(--font-mono);font-size:12.5px;color:var(--text-bright);
}
.msg-assistant .bubble pre{
  background:var(--code-bg);
  padding:14px 16px;margin:14px 0;border-radius:10px;
  border:1px solid var(--border);
  box-shadow:var(--shadow-1);
  overflow-x:auto;line-height:1.65;
}
.msg-assistant .bubble pre code{
  background:none;padding:0;border:none;
  color:var(--text);font-size:12.5px;
}
.msg-assistant .bubble ul,.msg-assistant .bubble ol{padding-left:22px;margin:12px 0}
.msg-assistant .bubble li{margin:5px 0}
.msg-assistant .bubble li::marker{color:var(--text-dim)}
.msg-assistant .bubble h1,.msg-assistant .bubble h2,.msg-assistant .bubble h3{
  color:var(--text-bright);margin:20px 0 9px;
  line-height:1.35;font-weight:600;letter-spacing:-.01em;
}
.msg-assistant .bubble h1{font-size:1.3em}
.msg-assistant .bubble h2{font-size:1.16em}
.msg-assistant .bubble h3{font-size:1.03em}
.msg-assistant .bubble h1:first-child,
.msg-assistant .bubble h2:first-child,
.msg-assistant .bubble h3:first-child{margin-top:0}
.msg-assistant .bubble blockquote{
  border-left:2px solid var(--accent-line);
  padding:2px 0 2px 14px;color:var(--text-dim);margin:14px 0;
}
.msg-assistant .bubble a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .14s}
.msg-assistant .bubble a:hover{border-bottom-color:var(--accent-line)}
.msg-assistant .bubble hr{border:none;border-top:1px solid var(--border);margin:20px 0}
.msg-assistant .bubble table{
  border-collapse:separate;border-spacing:0;
  margin:14px 0;font-size:13px;width:100%;
  border:1px solid var(--border);border-radius:10px;overflow:hidden;
}
.msg-assistant .bubble th,.msg-assistant .bubble td{
  border-bottom:1px solid var(--border);
  padding:8px 12px;text-align:left;
}
.msg-assistant .bubble tr:last-child td{border-bottom:none}
.msg-assistant .bubble th{background:var(--surface);color:var(--text-bright);font-weight:500}

.msg-system{text-align:center;color:var(--text-dim);font-size:12px;margin:16px 0}
.msg-error{
  display:block;color:var(--red);font-size:12.5px;
  margin:12px 0;padding:10px 14px;border-radius:10px;
  background:rgba(255,107,122,.07);
  border:1px solid rgba(255,107,122,.22);
}

/* ═══ 工具块 ═══ */
.tool-block{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  margin:12px 0;overflow:hidden;
  transition:border-color .15s ease,box-shadow .15s ease;
}
.tool-block:hover{border-color:var(--border-strong);box-shadow:var(--shadow-1)}
.tool-header{
  display:flex;align-items:center;gap:8px;
  padding:9px 12px;cursor:pointer;user-select:none;
  transition:background .13s ease;
}
.tool-header:hover{background:var(--surface-2)}
.tool-header .icon{font-size:9px;color:var(--text-dim);transition:transform .18s ease}
.tool-header .icon.expanded{transform:rotate(90deg)}
.tool-header .name{
  font-family:var(--font-mono);font-size:12px;font-weight:500;
  color:var(--text-bright);
}
.tool-header .status{
  margin-left:auto;flex-shrink:0;
  padding:2px 8px;border-radius:999px;
  background:var(--surface-3);
  font-family:var(--font-mono);font-size:11px;color:var(--text-dim);
  white-space:nowrap;
}
.tool-header .status.ok{color:var(--green);background:rgba(61,220,151,.10)}
.tool-header .status.err{color:var(--red);background:rgba(255,107,122,.10)}
.tool-header .status.loading{color:var(--yellow);background:rgba(244,183,64,.10)}
.tool-header .tool-args-preview{margin-left:4px;max-width:520px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim)}
.tool-body .tool-args{color:var(--accent);margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
.tool-body{
  display:none;
  margin:2px 10px 10px;padding:12px 14px;
  border-radius:8px;border:1px solid var(--border);
  background:var(--code-bg);
  font-family:var(--font-mono);font-size:11.5px;line-height:1.65;
  color:var(--text-dim);
  max-height:340px;overflow:auto;
  white-space:pre-wrap;word-break:break-word;
}
.tool-body.show{display:block}
.tool-body::-webkit-scrollbar{width:6px}
.tool-body::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}

/* ═══ 思考块 ═══ */
.thinking-block{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  margin:12px 0;overflow:hidden;
}
.thinking-header{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;cursor:pointer;user-select:none;
  font-size:12.5px;color:var(--text-dim);
  transition:background .13s ease;
}
.thinking-header:hover{background:var(--surface-2)}
.thinking-header .icon{font-size:9px;transition:transform .18s ease}
.thinking-header .icon.expanded{transform:rotate(90deg)}
.thinking-body{
  display:none;
  margin:2px 10px 10px;padding:12px 14px;
  border-radius:8px;border:1px solid var(--border);
  background:var(--code-bg);
  font-size:12px;line-height:1.7;color:var(--text-dim);
  max-height:320px;overflow-y:auto;
  white-space:pre-wrap;
}
.thinking-body.show{display:block}

/* ═══ 权限 / 提问弹窗 ═══ */
.perm-dialog{
  position:relative;overflow:hidden;
  margin:18px 0;padding:16px 18px;
  background:linear-gradient(180deg,var(--surface-2),var(--surface));
  border:1px solid rgba(244,183,64,.26);
  border-radius:12px;
  box-shadow:var(--shadow-2);
  animation:fadeUp .22s ease both;
}
.perm-dialog::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--yellow),transparent);
}
.perm-dialog .title{
  display:flex;align-items:center;gap:7px;
  font-size:13px;font-weight:600;color:var(--text-bright);
  margin-bottom:9px;
}
.perm-dialog .desc{
  font-family:var(--font-mono);font-size:12px;line-height:1.65;
  color:var(--text-dim);margin-bottom:15px;
  white-space:pre-wrap;word-break:break-word;
}
.perm-dialog .title::before{content:'';width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--yellow);box-shadow:0 0 0 3px rgba(244,183,64,.16)}
.perm-dialog .actions{display:flex;gap:8px;flex-wrap:wrap}
.perm-dialog button{
  height:30px;padding:0 14px;border-radius:8px;
  border:1px solid var(--border-strong);
  background:transparent;color:var(--text);
  font-size:12.5px;font-weight:500;cursor:pointer;
  transition:background .14s ease,border-color .14s ease,color .14s ease,transform .1s ease;
}
.perm-dialog button:active{transform:scale(.97)}
.btn-allow{
  background:linear-gradient(145deg,var(--accent),var(--accent-2))!important;
  color:#fff!important;border-color:transparent!important;
  box-shadow:0 6px 16px -6px rgba(91,140,255,.6);
}
.btn-allow:hover{filter:brightness(1.08)}
.btn-always{color:var(--accent)!important;border-color:var(--accent-line)!important}
.btn-always:hover{background:var(--accent-soft)!important}
.btn-deny{color:var(--red)!important;border-color:rgba(255,107,122,.3)!important}
.btn-deny:hover{background:rgba(255,107,122,.10)!important}

/* ═══ 斜杠菜单 ═══ */
#slash-menu{
  display:none;position:absolute;bottom:100%;left:18px;right:18px;
  margin-bottom:8px;padding:5px;
  background:var(--surface);
  border:1px solid var(--border-strong);
  border-radius:12px;
  box-shadow:var(--shadow-3);
  max-height:280px;overflow-y:auto;
  animation:fadeUp .14s ease both;
}
#slash-menu.show{display:block}
#slash-menu::-webkit-scrollbar{width:6px}
#slash-menu::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}
.slash-item{
  display:flex;align-items:baseline;gap:10px;
  padding:8px 10px;border-radius:7px;cursor:pointer;
  transition:background .1s ease;
}
.slash-item:hover{background:var(--surface-2)}
.slash-item.active{background:var(--surface-3)}
.slash-item .cmd-name{
  font-family:var(--font-mono);font-size:12.5px;font-weight:500;
  color:var(--text-bright);white-space:nowrap;
}
.slash-item.active .cmd-name{color:var(--accent)}
.slash-item .cmd-desc{
  font-size:12px;color:var(--text-dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* ═══ 输入区 ═══ */
#input-area{
  flex-shrink:0;
  padding:10px max(18px,calc((100% - 820px)/2)) 16px;
  background:linear-gradient(180deg,transparent,var(--bg) 30%);
}
.composer{
  display:flex;flex-direction:column;
  background:var(--surface);
  border:1px solid var(--border-strong);
  border-radius:14px;
  box-shadow:var(--shadow-2);
  overflow:hidden;
  transition:border-color .18s ease,box-shadow .18s ease;
}
.composer:focus-within{
  border-color:var(--accent-line);
  box-shadow:var(--shadow-2),0 0 0 3px var(--accent-soft);
}
#input-area textarea{
  width:100%;
  background:transparent;color:var(--text-bright);
  border:none;outline:none;resize:none;
  padding:14px 16px 6px;
  font-family:var(--font-sans);font-size:14.5px;line-height:1.6;
  min-height:48px;max-height:200px;
}
#input-area textarea::placeholder{color:var(--text-dim)}
#input-area textarea:disabled{opacity:.5}

.composer-bar{display:flex;align-items:center;gap:10px;padding:4px 8px 9px 10px}
.slash-btn{
  display:inline-flex;align-items:center;gap:4px;flex-shrink:0;
  height:26px;padding:0 8px;border-radius:7px;
  border:none;background:transparent;color:var(--text-dim);
  font-size:11.5px;cursor:pointer;
  transition:background .12s ease,color .12s ease;
}
.slash-btn:hover{background:var(--surface-3);color:var(--text-bright)}
.slash-btn .slash-icon{
  font-family:var(--font-mono);font-weight:600;font-size:12px;color:var(--accent);
}
.composer-hint{
  flex:1;display:flex;align-items:center;gap:5px;
  font-size:11px;color:var(--text-dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  user-select:none;
}
.composer-hint kbd{
  font-family:var(--font-mono);font-size:10px;line-height:1;
  padding:3px 5px;border-radius:4px;
  background:var(--surface-3);
  border:1px solid var(--border-strong);
  color:var(--text-dim);
}
.composer-hint .plus{font-size:10px;color:var(--text-dim);margin:0 1px}

#send-btn{
  display:inline-flex;align-items:center;gap:6px;flex-shrink:0;
  height:30px;padding:0 14px;border-radius:8px;border:none;
  background:linear-gradient(145deg,var(--accent),var(--accent-2));
  color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;
  box-shadow:0 8px 18px -8px rgba(91,140,255,.75);
  transition:filter .14s ease,transform .1s ease,opacity .15s ease;
}
#send-btn:hover:not(:disabled){filter:brightness(1.08)}
#send-btn:active:not(:disabled){transform:scale(.97)}
#send-btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
#send-btn svg{width:13px;height:13px}

/* ═══ 杂项 ═══ */
.cursor{animation:blink 1.05s step-end infinite;color:var(--accent)}
@keyframes blink{50%{opacity:0}}

.done-indicator{
  margin:18px 0 6px;text-align:center;
  font-family:var(--font-mono);font-size:11.5px;
  color:var(--text-dim);opacity:.85;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(5px)}
  to{opacity:1;transform:translateY(0)}
}

/* ═══ 历史面板 ═══ */
#history-panel{
  display:none;
  position:absolute;top:0;left:0;right:0;bottom:0;z-index:10;
  flex-direction:column;
  background:var(--bg);
  animation:fadeUp .16s ease both;
}
#history-panel.show{display:flex}
#history-header{
  display:flex;align-items:center;gap:10px;
  padding:12px 18px;border-bottom:1px solid var(--border);
  background:var(--bar-bg);
  backdrop-filter:blur(14px);
  flex-shrink:0;
}
#history-header .title{
  font-size:13px;font-weight:500;color:var(--text-bright);
  font-variant-numeric:tabular-nums;
}
#history-close{
  margin-left:auto;
  height:28px;padding:0 12px;border-radius:7px;
  border:1px solid var(--border-strong);background:transparent;
  color:var(--text-dim);font-size:12px;font-weight:500;cursor:pointer;
  transition:background .12s ease,color .12s ease;
}
#history-close:hover{background:var(--surface-2);color:var(--text-bright)}
#history-body{
  flex:1;overflow-y:auto;
  padding:24px max(22px,calc((100% - 820px)/2));
}
#history-body::-webkit-scrollbar{width:10px}
#history-body::-webkit-scrollbar-thumb{
  background:var(--border-strong);border-radius:5px;
  border:3px solid transparent;background-clip:content-box;
}

/* ═══ 响应式 ═══ */
@media (max-width:960px){
  .sidebar{display:none}
  #messages{padding:22px 18px 16px}
  #input-area{padding:10px 16px 14px}
  #slash-menu{left:16px;right:16px}
  .composer-hint{display:none}
  .composer-bar{justify-content:flex-end}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  #messages{scroll-behavior:auto}
}

</style>
</head>
<body>
<div id="app">

  <!-- ═══ 左栏：会话 ═══ -->
  <div class="sidebar" id="left-sidebar">
    <div class="sidebar-header">
      <span class="brand">
        <span class="brand-badge">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 2.6 20.6 7.4v9.2L12 21.4 3.4 16.6V7.4z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <circle cx="12" cy="12" r="2.4" fill="currentColor"/>
          </svg>
        </span>
        <span class="brand-name">MewAgent</span>
      </span>
      <button class="new-session-btn" onclick="newSession()" title="新建会话">
        <span class="plus">+</span><span>新建</span>
      </button>
    </div>
    <div class="session-count" id="session-count"></div>
    <div id="session-list">
      <div class="session-empty">Loading...</div>
    </div>
  </div>

  <!-- ═══ 中间：对话 ═══ -->
  <div id="center" style="position:relative;">
    <div id="status-bar">
      <div class="status-left">
        <span class="status-mark">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 2.6 20.6 7.4v9.2L12 21.4 3.4 16.6V7.4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
        </span>
        <span id="session-label"></span>
      </div>
      <div class="info">
        <span id="usage-meter" class="usage-meter" title="本次会话累计 token 用量">
          <span class="usage-item"><span class="usage-k">输入</span><span class="usage-v" id="usage-in">0</span></span>
          <span class="usage-sep"></span>
          <span class="usage-item"><span class="usage-k">输出</span><span class="usage-v" id="usage-out">0</span></span>
        </span>
        <div class="theme-toggle compact">
          <button class="theme-btn active" data-theme-val="dark" onclick="setTheme('dark')" title="深色" aria-label="深色主题">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          </button>
          <button class="theme-btn" data-theme-val="light" onclick="setTheme('light')" title="浅色" aria-label="浅色主题">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.6v2.2M12 19.2v2.2M21.4 12h-2.2M4.8 12H2.6M18.6 5.4l-1.6 1.6M7 17l-1.6 1.6M18.6 18.6 17 17M7 7 5.4 5.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </button>
        </div>
        <span id="conn-status" class="conn-status"><span class="dot disconnected"></span>未连接</span>
      </div>
    </div>

    <!-- ═══ 历史记录覆盖层 ═══ -->
    <div id="history-panel">
      <div id="history-header">
        <span class="title" id="history-title">会话</span>
        <button id="history-close" onclick="closeHistory()">✕ 关闭</button>
      </div>
      <div id="history-body"></div>
    </div>

    <div id="messages"></div>
    <div id="input-area" style="position:relative;">
      <div id="slash-menu"></div>
      <div class="composer">
        <textarea id="input" placeholder="描述一个任务，或按 / 查看命令…" rows="1"></textarea>
        <div class="composer-bar">
          <button type="button" class="slash-btn" onclick="openCmdMenu()" title="查看可用命令">
            <span class="slash-icon">/</span><span>命令</span>
          </button>
          <span class="composer-hint"><kbd>Enter</kbd><span>发送</span><span class="plus">·</span><kbd>Shift</kbd><span class="plus">+</span><kbd>Enter</kbd><span>换行</span></span>
          <button id="send-btn">
            <span>发送</span>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.5 12h13M12 5.5 18.5 12 12 18.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 右栏已移除：命令改由输入框内的斜杠菜单承载，主题切换收进顶部状态栏 -->
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
// ─── DOM refs ───
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const connStatus = document.getElementById('conn-status');
const slashMenu = document.getElementById('slash-menu');
const sessionList = document.getElementById('session-list');
const sessionCount = document.getElementById('session-count');
const sessionLabel = document.getElementById('session-label');
const historyPanel = document.getElementById('history-panel');
const historyBody = document.getElementById('history-body');
const historyTitle = document.getElementById('history-title');

// ─── State ───
let ws = null, streaming = false, allCommands = [], slashCursor = 0, slashFiltered = [];
let currentAssistantEl = null, currentStreamText = '', currentThinkingEl = null, currentThinkingText = '';
let autoScroll = true, pingTimer = null, connectedOnce = false;
let allSessions = [], currentSessionId = null;

// ─── Theme ───
function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('mewagent-theme', theme);
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.themeVal === theme));
}
(function(){const s=localStorage.getItem('mewagent-theme')||(window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');setTheme(s)})();

// ─── Markdown ───
if(typeof marked!=='undefined')marked.setOptions({breaks:true,gfm:true});
function renderMarkdown(t){if(typeof marked!=='undefined')try{return marked.parse(t)}catch(e){}return escapeHtml(t)}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// ─── 展示格式化 ───
function fmtTokens(n){
  n=Number(n)||0;
  if(n>=1000000)return (n/1000000).toFixed(n>=10000000?0:1)+'M';
  if(n>=1000)return (n/1000).toFixed(n>=10000?0:1)+'k';
  return String(n);
}
function updateUsage(inTok,outTok){
  const a=document.getElementById('usage-in'),b=document.getElementById('usage-out');
  const m=document.getElementById('usage-meter');
  if(a)a.textContent=fmtTokens(inTok);
  if(b)b.textContent=fmtTokens(outTok);
  if(m)m.style.display='inline-flex';
}
function resetUsage(){
  const m=document.getElementById('usage-meter');
  const a=document.getElementById('usage-in'),b=document.getElementById('usage-out');
  if(a)a.textContent='0';
  if(b)b.textContent='0';
  if(m)m.style.display='inline-flex';
}
// 后端 formatRelativeTime 返回英文，这里只做展示层转换，不改服务端
function relTime(s){
  if(!s)return '';
  return String(s)
    .replace(/^just now$/,'刚刚')
    .replace(/(\d+) minute(s?) ago/,'$1 分钟前')
    .replace(/(\d+) hour(s?) ago/,'$1 小时前')
    .replace(/(\d+) day(s?) ago/,'$1 天前')
    .replace(/(\d+) week(s?) ago/,'$1 周前')
    .replace(/(\d+) month(s?) ago/,'$1 个月前');
}
function sessionTitle(s){
  const raw=String((s&&(s.title||s.firstMessage||s.id))||'').replace(/\s+/g,' ').trim();
  return raw.length>36?raw.slice(0,36)+'…':raw;
}

// ─── WebSocket ───
function connect(){
  if(pingTimer){clearInterval(pingTimer);pingTimer=null}
  if(ws){try{ws.onclose=null;ws.close()}catch(e){}ws=null}
  const proto=location.protocol==='https:'?'wss:':'ws:';
  ws=new WebSocket(proto+'//'+location.host+'/ws');
  ws.onopen=()=>{
    connStatus.innerHTML='<span class="dot connected"></span>已连接';
    pingTimer=setInterval(()=>{if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'ping',data:{}}))},10000);
    ws.send(JSON.stringify({type:'list_sessions',data:{}}));
  };
  ws.onclose=()=>{
    connStatus.innerHTML='<span class="dot disconnected"></span>重连中…';
    if(pingTimer){clearInterval(pingTimer);pingTimer=null}
    setTimeout(connect,3000);
  };
  ws.onerror=()=>{};
  ws.onmessage=(evt)=>{const msg=JSON.parse(evt.data);handleMessage(msg)};
}

// ─── Message handler ───
function handleMessage(msg){
  switch(msg.type){
    case 'connected': {
      const isNewSession=msg.data.session!==currentSessionId;
      currentSessionId=msg.data.session;
      sessionLabel.textContent='会话 · '+formatSessionLabel(msg.data.session);
      sessionLabel.title=msg.data.session+'  ·  '+msg.data.cwd;
      if(isNewSession)resetUsage();
      if(!connectedOnce){showWelcome();connectedOnce=true}
      break;
    }
    case 'sessions':
      allSessions=msg.data||[];
      renderSessions();
      break;
    case 'commands':
      allCommands=msg.data||[];
      renderCommands();
      break;
    case 'system': addSystem(msg.data.message); break;
    case 'clear': messagesEl.innerHTML=''; addSystem('对话已清空'); break;
    case 'command_done': streaming=false; updateUI(); break;
    case 'replay_user': addUser(msg.data.content); break;
    case 'replay_assistant':{const el=addAssistant('');updateAssistant(el,msg.data.content,false);break;}
    case 'stream_text':
      if(currentThinkingEl){currentThinkingEl.querySelector('.thinking-header span:last-child').textContent='💭 思考';currentThinkingEl=null;currentThinkingText=''}
      if(!currentAssistantEl){currentAssistantEl=addAssistant('');currentStreamText=''}
      currentStreamText+=msg.data.text;
      updateAssistant(currentAssistantEl,currentStreamText,true);
      break;
    case 'stream_end':
      if(currentAssistantEl){updateAssistant(currentAssistantEl,currentStreamText,false)}
      currentAssistantEl=null;currentStreamText='';
      break;
    case 'thinking_text':
      if(!currentThinkingEl){currentThinkingEl=addThinking();currentThinkingText=''}
      currentThinkingText+=msg.data.text;
      currentThinkingEl.querySelector('.thinking-body').textContent=currentThinkingText;
      break;
    case 'tool_use':
      if(currentThinkingEl){currentThinkingEl.querySelector('.thinking-header span:last-child').textContent='💭 思考';currentThinkingEl=null;currentThinkingText=''}
      addToolUse(msg.data);
      break;
    case 'tool_result': updateToolResult(msg.data); break;
    case 'permission_request': addPermissionDialog(msg.data); break;
    case 'ask_user': addAskUserDialog(msg.data); break;
    case 'loop_complete':
      if(currentAssistantEl){updateAssistant(currentAssistantEl,currentStreamText,false);currentAssistantEl=null;currentStreamText=''}
      currentThinkingEl=null;currentThinkingText='';
      const el=document.createElement('div');el.className='done-indicator';el.textContent='✻ 完成 · '+msg.data.elapsed.toFixed(1)+'s';
      messagesEl.appendChild(el);streaming=false;updateUI();scrollToBottom();
      if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'list_sessions',data:{}}));
      break;
    case 'usage': updateUsage(msg.data.inputTokens,msg.data.outputTokens); break;
    case 'error': addError(msg.data.message);streaming=false;updateUI();break;
    case 'compact': addSystem('⟳ '+msg.data.message);break;
    case 'retry': addSystem('↻ 重试中：'+msg.data.reason);break;
    case 'session_history':
      showSessionHistory(msg.data);
      break;
    case 'session_deleted':
      if(msg.data&&msg.data.id===currentSessionId){currentSessionId=null;closeHistory()}
      break;
  }
}

// ─── Session List (IDs only) ───
function renderSessions(){
  sessionCount.textContent=allSessions.length+' 个会话';
  if(allSessions.length===0){
    sessionList.innerHTML='<div class="session-empty">还没有会话<br>在右侧描述一个任务即可开始</div>';return;
  }
  sessionList.innerHTML=allSessions.map(s=>{
    const active=s.id===currentSessionId?'active':'';
    const title=sessionTitle(s);
    const parts=[];
    if(s.relativeTime)parts.push(relTime(s.relativeTime));
    if(s.messageCount)parts.push(s.messageCount+' 条消息');
    const meta=parts.join(' · ');
    return '<div class="session-item '+active+'" title="'+escapeHtml(s.id)+'" onclick="viewSession(\''+s.id+'\')">'
      +'<div class="session-main">'
        +'<div class="session-title">'+escapeHtml(title)+'</div>'
        +'<div class="session-meta">'+escapeHtml(meta)+'</div>'
      +'</div>'
      +'<button class="session-del" title="删除会话" onclick="event.stopPropagation();askDelete(\''+s.id+'\',this)">×</button>'
      +'</div>';
  }).join('');
}

// 删除会话：第一次点击进入待确认态，3 秒内再点一次才真正删除
function askDelete(id,btn){
  if(btn.dataset.armed==='1'){
    btn.dataset.armed='';btn.classList.remove('armed');
    btn.textContent='×';btn.title='删除会话';
    if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'delete_session',data:{id}}));
    return;
  }
  btn.dataset.armed='1';btn.classList.add('armed');
  btn.textContent='✓';btn.title='再次点击确认删除';
  setTimeout(()=>{
    if(btn.isConnected&&btn.dataset.armed==='1'){
      btn.dataset.armed='';btn.classList.remove('armed');
      btn.textContent='×';btn.title='删除会话';
    }
  },3000);
}

function viewSession(id){
  if(ws&&ws.readyState===WebSocket.OPEN){
    ws.send(JSON.stringify({type:'get_session_history',data:{id}}));
  }
}

function closeHistory(){
  historyPanel.classList.remove('show');
}

function showSessionHistory(data){
  const msgs=data.messages||[];
  historyTitle.textContent='会话 · '+formatSessionLabel(data.id);
  historyTitle.title=data.id;
  historyBody.innerHTML='';
  if(msgs.length===0){
    historyBody.innerHTML='<div class="session-empty">该会话还没有消息</div>';
  }else{
    msgs.forEach(m=>{
      const div=document.createElement('div');
      const bubble=document.createElement('div');
      if(m.role==='user'){
        div.className='msg msg-user';
        bubble.className='bubble';
        bubble.textContent=m.content;
      }else{
        div.className='msg msg-assistant';
        bubble.className='bubble';
        bubble.innerHTML=renderMarkdown(m.content);
      }
      div.appendChild(bubble);
      historyBody.appendChild(div);
    });
  }
  historyPanel.classList.add('show');
}

// ─── Commands ───
// 命令列表现在只用于输入框内的斜杠菜单，不再渲染到侧栏
function renderCommands(){}

// ─── Message renderers ───
function addUser(text){
  clearWelcome();
  const div=document.createElement('div');div.className='msg msg-user';
  div.innerHTML='<div class="bubble">'+escapeHtml(text)+'</div>';
  messagesEl.appendChild(div);scrollToBottom();
}
function addAssistant(text){
  const div=document.createElement('div');div.className='msg msg-assistant';
  div.innerHTML='<div class="bubble"></div>';
  messagesEl.appendChild(div);scrollToBottom();
  return div;
}
function updateAssistant(el,text,isStreaming){
  const contentEl=el.querySelector('.bubble');
  const thinkMatch=text.match(/^<think>([\s\S]*?)<\/think>\s*([\s\S]*)$/);
  if(thinkMatch){
    const thinkText=thinkMatch[1].trim(),bodyText=thinkMatch[2].trim();
    let html='';
    if(thinkText)html+='<div class="thinking-block"><div class="thinking-header" onclick="toggleThinking(this)"><span class="icon">▶</span><span>💭 思考</span></div><div class="thinking-body">'+escapeHtml(thinkText)+'</div></div>';
    if(bodyText)html+=renderMarkdown(bodyText);
    if(isStreaming)html+='<span class="cursor">▎</span>';
    contentEl.innerHTML=html;
  }else if(text.startsWith('<think>')&&isStreaming){
    const thinkBody=text.replace(/^<think>\s*/,'');
    let html='<div class="thinking-block"><div class="thinking-header" onclick="toggleThinking(this)"><span class="icon">▶</span><span>💭 思考中…</span></div><div class="thinking-body">'+escapeHtml(thinkBody)+'</div></div><span class="cursor">▎</span>';
    contentEl.innerHTML=html;
  }else{
    let html=renderMarkdown(text);
    if(isStreaming)html+='<span class="cursor">▎</span>';
    contentEl.innerHTML=html;
  }
  scrollToBottom();
}
function addThinking(){
  const div=document.createElement('div');div.className='thinking-block';
  div.innerHTML='<div class="thinking-header" onclick="toggleThinking(this)"><span class="icon">▶</span><span>💭 思考中…</span></div><div class="thinking-body"></div>';
  messagesEl.appendChild(div);scrollToBottom();return div;
}
function toggleThinking(header){header.querySelector('.icon').classList.toggle('expanded');header.nextElementSibling.classList.toggle('show')}

// ─── 欢迎引导（替代裸系统消息的空状态）───
const WELCOME_TIPS=['概述一下这个项目的架构','检查代码里潜在的问题','帮我给核心模块补测试'];
function formatSessionLabel(id){
  const m=/^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})/.exec(id||'');
  return m ? (m[2]+'-'+m[3]+' '+m[4]+':'+m[5]) : (id||'');
}
function showWelcome(){
  if(messagesEl.querySelector('.welcome'))return;
  const w=document.createElement('div');
  w.className='welcome';
  w.innerHTML='<div class="welcome-card">'
    +'<div class="welcome-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true">'
    +'<path d="M12 2.6 20.6 7.4v9.2L12 21.4 3.4 16.6V7.4z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>'
    +'<circle cx="12" cy="12" r="2.7" fill="currentColor" opacity="0.92"/></svg></div>'
    +'<h2>有什么可以帮你？</h2>'
    +'<p>描述一个任务，我会读代码、改文件、跑命令把它做完。</p>'
    +'<div class="welcome-tips">'+WELCOME_TIPS.map((t,i)=>'<button type="button" onclick="useTip('+i+')">'+escapeHtml(t)+'</button>').join('')+'</div>'
    +'</div>';
  messagesEl.appendChild(w);
}
function clearWelcome(){const w=messagesEl.querySelector('.welcome');if(w)w.remove()}
function useTip(i){inputEl.value=WELCOME_TIPS[i];inputEl.focus()}

function addSystem(t){clearWelcome();const d=document.createElement('div');d.className='msg msg-system';d.textContent=t;messagesEl.appendChild(d);scrollToBottom()}
function addError(t){clearWelcome();const d=document.createElement('div');d.className='msg msg-error';d.textContent='✖ '+t;messagesEl.appendChild(d);scrollToBottom()}

// ─── Tool blocks ───
const toolElements={};
function toolKeyOf(data){return data.toolName+'_'+(data.toolId||'')}
function toolArgsPreview(args){
  if(!args)return '';
  return args.command||args.file_path||args.pattern||args.path||'';
}
function addToolUse(data){
  const key=toolKeyOf(data);
  const argsPreview=toolArgsPreview(data.args);
  const argsStr=(data.args&&Object.keys(data.args).length)?JSON.stringify(data.args,null,2):'';
  const existing=toolElements[key];

  // 同一个 tool call 会到达两个事件：ToolCallStart（无参数）与 ToolCallComplete（带参数）。
  // 第二次只补全参数，不重复建卡片，否则第一张会永远停在"运行中"。
  if(existing){
    const preview=existing.querySelector('.tool-args-preview');
    if(preview&&argsPreview&&!preview.textContent){preview.textContent=argsPreview;preview.style.display='inline'}
    const argsBox=existing.querySelector('.tool-args');
    if(argsBox&&argsStr&&!argsBox.textContent){argsBox.textContent='参数\n'+argsStr;argsBox.style.display='block'}
    scrollToBottom();
    return;
  }

  const div=document.createElement('div');div.className='tool-block';
  div.innerHTML='<div class="tool-header" onclick="toggleTool(this)">'
    +'<span class="icon">▶</span>'
    +'<span class="name">'+escapeHtml(data.toolName)+'</span>'
    +'<span class="tool-args-preview"'+(argsPreview?'':' style="display:none"')+'>'+escapeHtml(argsPreview)+'</span>'
    +'<span class="status loading">⏳ 运行中…</span>'
    +'</div>'
    +'<div class="tool-body">'
    +'<div class="tool-args"'+(argsStr?'':' style="display:none"')+'>'+(argsStr?'参数\n'+escapeHtml(argsStr):'')+'</div>'
    +'<div class="tool-output"></div>'
    +'</div>';
  messagesEl.appendChild(div);
  toolElements[key]=div;
  scrollToBottom();
}
function updateToolResult(data){
  const key=data.toolName+'_'+(data.toolId||''),div=toolElements[key];
  if(div){
    const statusEl=div.querySelector('.status');
    if(data.isError){statusEl.className='status err';statusEl.textContent='✗ '+data.elapsed.toFixed(1)+'s'}
    else{statusEl.className='status ok';statusEl.textContent='✓ '+data.elapsed.toFixed(1)+'s'}
    const outputEl=div.querySelector('.tool-output');
    if(data.output)outputEl.textContent=data.output.length>5000?data.output.substring(0,5000)+'\n…（已截断）':data.output;
    delete toolElements[key];
  }else{
    const block=document.createElement('div');block.className='tool-block';
    const status=data.isError?'✗':'✓',statusClass=data.isError?'err':'ok';
    block.innerHTML='<div class="tool-header" onclick="toggleTool(this)"><span class="icon">▶</span><span class="name">'+escapeHtml(data.toolName)+'</span><span class="status '+statusClass+'">'+status+' '+data.elapsed.toFixed(1)+'s</span></div><div class="tool-body">'+escapeHtml(data.output||'')+'</div>';
    messagesEl.appendChild(block);
  }
  scrollToBottom();
}
function toggleTool(header){header.querySelector('.icon').classList.toggle('expanded');header.nextElementSibling.classList.toggle('show')}

// ─── Dialogs ───
function addPermissionDialog(data){
  const div=document.createElement('div');div.className='perm-dialog';div.id='perm-'+data.id;
  div.innerHTML='<div class="title">需要授权：'+escapeHtml(data.toolName)+'</div><div class="desc">'+escapeHtml(data.description)+'</div><div class="actions"><button class="btn-allow" onclick="respondPerm(\''+data.id+'\',\'allow\')">允许</button><button class="btn-always" onclick="respondPerm(\''+data.id+'\',\'allowAlways\')">始终允许</button><button class="btn-deny" onclick="respondPerm(\''+data.id+'\',\'deny\')">拒绝</button></div>';
  messagesEl.appendChild(div);scrollToBottom();
}
function respondPerm(id,r){ws.send(JSON.stringify({type:'permission_response',data:{id,response:r}}));const el=document.getElementById('perm-'+id);if(el)el.innerHTML='<div style="color:var(--text-dim)">已授权：'+({allow:'允许',allowAlways:'始终允许',deny:'拒绝'}[r]||r)+'</div>'}
function addAskUserDialog(data){
  const div=document.createElement('div');div.className='perm-dialog';div.id='ask-'+data.id;
  let html='<div class="title">需要确认</div>';(data.questions||[]).forEach((q,qi)=>{html+='<div style="margin-bottom:12px;"><div style="margin-bottom:6px;color:var(--text-bright);">'+escapeHtml(q.question||q.Text||'')+'</div>';(q.options||q.Options||[]).forEach(opt=>{const label=opt.label||opt.Label||'',desc=opt.description||opt.Description||'';html+='<label style="display:block;margin:4px 0;cursor:pointer;"><input type="radio" name="ask_'+data.id+'_'+qi+'" value="'+escapeHtml(label)+'"> <span style="color:var(--accent)">'+escapeHtml(label)+'</span>'+(desc?' <span style="color:var(--text-dim);font-size:12px;">— '+escapeHtml(desc)+'</span>':'')+'</label>'});html+='<label style="display:block;margin:4px 0;cursor:pointer;"><input type="radio" name="ask_'+data.id+'_'+qi+'" value="__other__"> <span style="color:var(--text-dim)">其他：</span><input type="text" id="ask_other_'+data.id+'_'+qi+'" style="background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-family:inherit;font-size:13px;width:200px;"></label></div>'});
  html+='<div class="actions"><button class="btn-allow" onclick="respondAsk(\''+data.id+'\','+(data.questions||[]).length+')">提交</button></div>';
  div.innerHTML=html;messagesEl.appendChild(div);scrollToBottom();
}
function respondAsk(id,qCount){
  const answers={};for(let i=0;i<qCount;i++){const radios=document.querySelectorAll('input[name="ask_'+id+'_'+i+'"]');let val='';radios.forEach(r=>{if(r.checked)val=r.value==='__other__'?document.getElementById('ask_other_'+id+'_'+i).value:r.value});answers['question_'+i]=val}
  ws.send(JSON.stringify({type:'ask_user_response',data:{id,answers}}));const el=document.getElementById('ask-'+id);if(el)el.innerHTML='<div style="color:var(--text-dim)">✓ 已回答</div>'
}

// ─── Scroll ───
messagesEl.addEventListener('scroll',()=>{const{scrollTop,scrollHeight,clientHeight}=messagesEl;autoScroll=scrollHeight-scrollTop-clientHeight<60});
function scrollToBottom(){if(autoScroll)requestAnimationFrame(()=>{messagesEl.scrollTop=messagesEl.scrollHeight})}

// ─── Input ───
function runCommand(text){if(!text||streaming)return;addUser(text);ws.send(JSON.stringify({type:'user_message',data:{content:text}}));inputEl.value='';inputEl.style.height='auto';streaming=true;updateUI()}
function sendMessage(){if(slashMenu.classList.contains('show'))hideSlashMenu();runCommand(inputEl.value.trim())}
function updateUI(){sendBtn.disabled=streaming;inputEl.disabled=streaming;if(!streaming)inputEl.focus()}

// ─── Slash menu ───
function openCmdMenu(){
  if(!allCommands.length)return;
  if(!inputEl.value.startsWith('/'))inputEl.value='/';
  inputEl.focus();
  inputEl.dispatchEvent(new Event('input'));
}
function showSlashMenu(f){const p=f.toLowerCase();slashFiltered=allCommands.filter(c=>c.name.startsWith(p));if(!slashFiltered.length){hideSlashMenu();return}slashCursor=0;renderSlashMenu();slashMenu.classList.add('show')}
function hideSlashMenu(){slashMenu.classList.remove('show');slashFiltered=[];slashCursor=0}
function renderSlashMenu(){slashMenu.innerHTML=slashFiltered.map((c,i)=>'<div class="slash-item'+(i===slashCursor?' active':'')+'" data-idx="'+i+'"><span class="cmd-name">/'+escapeHtml(c.name)+'</span><span class="cmd-desc">'+escapeHtml(c.description)+'</span></div>').join('');slashMenu.querySelectorAll('.slash-item').forEach(el=>{el.addEventListener('mousedown',(e)=>{e.preventDefault();selectSlashItem(parseInt(el.dataset.idx))})});const ae=slashMenu.querySelector('.active');if(ae)ae.scrollIntoView({block:'nearest'})}
// 这些命令不需要参数，选中后直接执行；其余命令填入输入框等待补参数
// 不需要参数、选中即执行；clear 有破坏性，故意留在外面要求再确认一次
const NO_ARG_CMDS=new Set(['compact','status','help','mcp','review','plan']);
function selectSlashItem(i){
  const c=slashFiltered[i];if(!c)return;
  hideSlashMenu();
  if(NO_ARG_CMDS.has(c.name)){
    inputEl.value='';
    runCommand('/'+c.name);
  }else{
    inputEl.value='/'+c.name+' ';
    inputEl.focus();
  }
}
inputEl.addEventListener('keydown',(e)=>{if(slashMenu.classList.contains('show')){if(e.key==='ArrowDown'){e.preventDefault();slashCursor=Math.min(slashCursor+1,slashFiltered.length-1);renderSlashMenu();return}if(e.key==='ArrowUp'){e.preventDefault();slashCursor=Math.max(slashCursor-1,0);renderSlashMenu();return}if(e.key==='Tab'||e.key==='Enter'&&!e.shiftKey){e.preventDefault();selectSlashItem(slashCursor);return}if(e.key==='Escape'){e.preventDefault();hideSlashMenu();return}}if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}})
inputEl.addEventListener('input',()=>{inputEl.style.height='auto';inputEl.style.height=Math.min(inputEl.scrollHeight,200)+'px';const v=inputEl.value;if(v.startsWith('/')&&!v.includes('\n')){const p=v.substring(1).split(' ')[0];if(!v.includes(' '))showSlashMenu(p);else hideSlashMenu()}else hideSlashMenu()})
sendBtn.addEventListener('click',sendMessage);

// ─── New session ───
function newSession(){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'new_session'}))}

// ─── Start ───
connect();inputEl.focus();
</script>
