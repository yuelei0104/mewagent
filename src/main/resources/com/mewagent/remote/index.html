<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1f1f1f">
<title>MewAgent Remote</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "Courier New", monospace;

  /* 灰阶层级：主区亮、侧栏暗、浮层再亮一层 */
  --bg: #1f1f1f;
  --bg-2: #181818;
  --glass: #181818;
  --glass-solid: #202020;
  --surface: #262626;
  --surface-hover: #2a2a2a;
  --bg-input: #1f1f1f;

  --text: #cccccc;
  --text-dim: #8b8b8b;
  --text-bright: #e8e8e8;

  --accent: #4a9eff;
  --accent-2: #4a9eff;
  --accent-3: #4a9eff;
  --accent-soft: rgba(74, 158, 255, 0.14);

  --green: #4ec9b0;
  --red: #f14c4c;
  --yellow: #cca700;
  --blue: #4a9eff;

  --border: #2b2b2b;
  --border-strong: #3c3c3c;

  --code-bg: #161616;
  --tool-bg: transparent;

  --user-bg: #2a2a2a;
  --user-border: transparent;
  --assistant-bg: transparent;
  --assistant-border: transparent;

  --radius: 6px;
  --shadow-lift: none;
  --glow: none;
}

[data-theme="light"] {
  --bg: #ffffff;
  --bg-2: #f8f8f8;
  --glass: #f8f8f8;
  --glass-solid: #ffffff;
  --surface: #f3f3f3;
  --surface-hover: #ececec;
  --bg-input: #ffffff;

  --text: #3b3b3b;
  --text-dim: #767676;
  --text-bright: #1a1a1a;

  --accent: #005fb8;
  --accent-2: #005fb8;
  --accent-3: #005fb8;
  --accent-soft: rgba(0, 95, 184, 0.09);

  --green: #107c10;
  --red: #c72e2e;
  --yellow: #9a6700;
  --blue: #005fb8;

  --border: #e5e5e5;
  --border-strong: #d0d0d0;

  --code-bg: #f5f5f5;
  --tool-bg: transparent;

  --user-bg: #f0f0f0;
  --user-border: transparent;
  --assistant-bg: transparent;
  --assistant-border: transparent;

  --shadow-lift: none;
  --glow: none;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  transition: background 0.2s ease, color 0.2s ease;
  overflow: hidden;
}

#app { display: flex; height: 100vh; position: relative; }

/* ═══ 侧边栏 ═══ */
.sidebar {
  width: 240px; flex-shrink: 0;
  background: var(--glass);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
  transition: background 0.2s ease;
}
.sidebar-header {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.sidebar-header > span {
  font-weight: 500; font-size: 11px; letter-spacing: 0.6px;
  text-transform: uppercase; color: var(--text-dim);
}
.sidebar-header .brand {
  display: flex; align-items: center; gap: 8px;
  font-size: 13.5px; font-weight: 600; letter-spacing: 0;
  color: var(--text-bright);
}
.brand-mark { width: 17px; height: 17px; flex-shrink: 0; color: var(--accent); }

/* ═══ 中间区 ═══ */
#center { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }

/* ═══ 状态栏 ═══ */
#status-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 16px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  font-size: 12px; color: var(--text-dim);
  flex-shrink: 0;
}
#status-bar .info { display: flex; gap: 14px; align-items: center; }
#session-label {
  font-size: 12px; color: var(--text-dim);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.dot.connected { background: var(--green); }
.dot.disconnected { background: var(--red); }

/* ═══ 消息区 ═══ */
#messages {
  flex: 1; overflow-y: auto;
  padding: 22px max(24px, calc((100% - 780px) / 2)) 16px;
  scroll-behavior: smooth;
}
#messages::-webkit-scrollbar { width: 10px; }
#messages::-webkit-scrollbar-track { background: transparent; }
#messages::-webkit-scrollbar-thumb {
  background: var(--border-strong); border-radius: 5px;
  border: 3px solid transparent; background-clip: content-box;
}
#messages::-webkit-scrollbar-thumb:hover { background: #4a4a4a; background-clip: content-box; }

/* ── 欢迎引导 ── */
.welcome {
  display: flex; justify-content: center;
  padding: 16vh 16px 48px;
  animation: fadeUp 0.35s ease both;
}
.welcome-card { max-width: 420px; width: 100%; text-align: center; }
.welcome-icon {
  width: 44px; height: 44px; margin: 0 auto 16px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 10px; color: var(--accent);
  background: transparent;
  border: 1px solid var(--border-strong);
}
.welcome-icon svg { width: 22px; height: 22px; }
.welcome-card h2 {
  font-size: 17px; font-weight: 600; letter-spacing: 0;
  color: var(--text-bright); margin-bottom: 6px;
}
.welcome-card p {
  font-size: 13px; line-height: 1.65; color: var(--text-dim);
  margin-bottom: 20px;
}
.welcome-tips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.welcome-tips button {
  background: transparent; color: var(--text);
  border: 1px solid var(--border-strong); border-radius: 5px;
  padding: 6px 12px; font-size: 12.5px; font-family: inherit;
  cursor: pointer;
  transition: background 0.13s ease, border-color 0.13s ease;
}
.welcome-tips button:hover {
  background: var(--surface-hover); border-color: #4a4a4a;
}

/* ── 用户消息 ── */
.msg-user { display: flex; justify-content: flex-end; margin-bottom: 22px; }
.msg-user .bubble {
  max-width: 72%; padding: 9px 14px;
  background: var(--user-bg);
  border-radius: 8px;
  color: var(--text-bright); line-height: 1.62;
  font-size: 14px;
  white-space: pre-wrap; word-break: break-word;
}

/* ── 助手消息：无气泡，文档流 ── */
.msg-assistant { display: flex; justify-content: flex-start; margin-bottom: 26px; }
.msg-assistant .bubble {
  max-width: 100%; padding: 0;
  background: transparent; border: none;
  color: var(--text); line-height: 1.74;
  font-size: 14px;
  word-break: break-word;
}
.msg-assistant .bubble p { margin-bottom: 10px; }
.msg-assistant .bubble p:last-child { margin-bottom: 0; }
.msg-assistant .bubble code {
  background: var(--code-bg); padding: 1px 5px; border-radius: 4px;
  font-family: var(--font-mono); font-size: 12.5px;
  color: var(--text-bright);
}
.msg-assistant .bubble pre {
  background: var(--code-bg); padding: 12px 14px; border-radius: 6px;
  margin: 12px 0; overflow-x: auto;
  border: 1px solid var(--border);
}
.msg-assistant .bubble pre code {
  background: none; padding: 0; border: none;
  color: var(--text); font-size: 12.5px; line-height: 1.65;
}
.msg-assistant .bubble ul, .msg-assistant .bubble ol { padding-left: 20px; margin: 10px 0; }
.msg-assistant .bubble li { margin: 4px 0; }
.msg-assistant .bubble li::marker { color: var(--text-dim); }
.msg-assistant .bubble h1, .msg-assistant .bubble h2, .msg-assistant .bubble h3 {
  color: var(--text-bright); margin: 18px 0 8px; line-height: 1.35; font-weight: 600;
}
.msg-assistant .bubble h1 { font-size: 1.25em; }
.msg-assistant .bubble h2 { font-size: 1.14em; }
.msg-assistant .bubble h3 { font-size: 1.02em; }
.msg-assistant .bubble h1:first-child, .msg-assistant .bubble h2:first-child, .msg-assistant .bubble h3:first-child { margin-top: 0; }
.msg-assistant .bubble blockquote {
  border-left: 2px solid var(--border-strong);
  padding: 2px 0 2px 12px;
  color: var(--text-dim); margin: 12px 0;
}
.msg-assistant .bubble a { color: var(--accent); text-decoration: none; }
.msg-assistant .bubble a:hover { text-decoration: underline; }
.msg-assistant .bubble hr { border: none; border-top: 1px solid var(--border); margin: 18px 0; }
.msg-assistant .bubble table { border-collapse: collapse; margin: 12px 0; font-size: 13px; width: 100%; }
.msg-assistant .bubble th, .msg-assistant .bubble td {
  border: 1px solid var(--border); padding: 6px 10px; text-align: left;
}
.msg-assistant .bubble th { background: var(--surface); color: var(--text-bright); font-weight: 500; }

.msg-system {
  text-align: center; color: var(--text-dim); font-size: 12px;
  margin: 14px 0;
}
.msg-error {
  color: var(--red); font-size: 12.5px; margin: 12px 0;
  padding: 8px 12px; border-radius: 5px;
  background: rgba(241, 76, 76, 0.08);
  border: 1px solid rgba(241, 76, 76, 0.24);
  border-left-width: 2px;
  display: block;
}

/* ═══ 工具块：左侧细线标注，不用卡片 ═══ */
.tool-block {
  border-left: 2px solid var(--border-strong);
  margin: 10px 0; overflow: hidden;
  transition: border-color 0.15s ease;
}
.tool-block:hover { border-left-color: var(--accent); }
.tool-header {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 10px; cursor: pointer; user-select: none;
  font-size: 12.5px;
  transition: background 0.13s ease;
}
.tool-header:hover { background: var(--surface); }
.tool-header .icon {
  font-size: 9px; color: var(--text-dim);
  transition: transform 0.18s ease;
}
.tool-header .icon.expanded { transform: rotate(90deg); }
.tool-header .name {
  color: var(--text-bright); font-weight: 500;
  font-family: var(--font-mono); font-size: 12px;
}
.tool-header .status { margin-left: auto; font-size: 11.5px; font-family: var(--font-mono); color: var(--text-dim); }
.tool-header .status.ok { color: var(--green); }
.tool-header .status.err { color: var(--red); }
.tool-header .status.loading { color: var(--yellow); }
.tool-body {
  display: none; padding: 10px 12px;
  margin: 4px 0 0 10px;
  background: var(--code-bg); border-radius: 6px;
  font-family: var(--font-mono); font-size: 11.5px; line-height: 1.6;
  max-height: 320px; overflow-y: auto;
  white-space: pre-wrap; color: var(--text-dim);
}
.tool-body.show { display: block; }
.tool-body::-webkit-scrollbar { width: 6px; }
.tool-body::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

/* ═══ 思考块 ═══ */
.thinking-block {
  border-left: 2px solid var(--border);
  margin: 10px 0; overflow: hidden;
}
.thinking-header {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 10px; cursor: pointer; user-select: none;
  font-size: 12.5px; color: var(--text-dim);
  transition: background 0.13s ease;
}
.thinking-header:hover { background: var(--surface); }
.thinking-header .icon { font-size: 9px; transition: transform 0.18s ease; }
.thinking-header .icon.expanded { transform: rotate(90deg); }
.thinking-body {
  display: none; padding: 8px 12px;
  margin: 4px 0 0 10px;
  border-radius: 6px; background: var(--code-bg);
  font-size: 12px; line-height: 1.65;
  max-height: 320px; overflow-y: auto;
  white-space: pre-wrap; color: var(--text-dim);
}
.thinking-body.show { display: block; }

/* ═══ 权限 / 提问弹窗 ═══ */
.perm-dialog {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-left: 2px solid var(--yellow);
  border-radius: 6px; padding: 14px 16px; margin: 16px 0;
  animation: fadeUp 0.2s ease both;
}
.perm-dialog .title {
  color: var(--text-bright); font-weight: 600; margin-bottom: 8px;
  font-size: 13px;
}
.perm-dialog .desc {
  color: var(--text-dim); margin-bottom: 13px; font-size: 12px;
  white-space: pre-wrap; line-height: 1.6;
  font-family: var(--font-mono);
}
.perm-dialog .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.perm-dialog button {
  padding: 6px 14px; border-radius: 5px; border: 1px solid var(--border-strong);
  cursor: pointer; font-family: var(--font-sans); font-size: 12.5px; font-weight: 500;
  background: transparent; color: var(--text);
  transition: background 0.13s ease, border-color 0.13s ease;
}
.perm-dialog button:hover { background: var(--surface-hover); }
.btn-allow {
  background: var(--accent) !important;
  color: #ffffff !important; border-color: transparent !important;
}
.btn-allow:hover { filter: brightness(1.1); }
.btn-deny { color: var(--red) !important; }
.btn-deny:hover { background: rgba(241, 76, 76, 0.12) !important; }
.btn-always { color: var(--accent) !important; }
.btn-always:hover { background: var(--accent-soft) !important; }

/* ═══ 斜杠菜单 ═══ */
#slash-menu {
  display: none; position: absolute; bottom: 100%; left: 18px; right: 18px;
  background: var(--glass-solid);
  border: 1px solid var(--border-strong); border-radius: 8px;
  margin-bottom: 6px; max-height: 260px; overflow-y: auto;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  padding: 4px;
  animation: fadeUp 0.13s ease both;
}
#slash-menu.show { display: block; }
#slash-menu::-webkit-scrollbar { width: 6px; }
#slash-menu::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
.slash-item {
  padding: 7px 10px; cursor: pointer;
  display: flex; gap: 10px; align-items: baseline;
  border-radius: 4px; transition: background 0.1s ease;
}
.slash-item:hover { background: var(--surface-hover); }
.slash-item.active { background: var(--surface); }
.slash-item .cmd-name {
  color: var(--text-bright); font-weight: 500; white-space: nowrap;
  font-family: var(--font-mono); font-size: 12.5px;
}
.slash-item.active .cmd-name { color: var(--accent); }
.slash-item .cmd-desc {
  color: var(--text-dim); font-size: 12px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* ═══ 输入区 ═══ */
#input-area {
  flex-shrink: 0;
  border-top: 1px solid var(--border);
  padding: 12px max(18px, calc((100% - 780px) / 2)) 14px;
  background: var(--bg);
}
.composer {
  display: flex; flex-direction: column;
  background: var(--bg-input);
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  overflow: hidden;
  transition: border-color 0.13s ease, box-shadow 0.13s ease;
}
.composer:focus-within {
  border-color: var(--accent);
}
#input-area textarea {
  width: 100%;
  background: transparent;
  color: var(--text-bright);
  border: none; outline: none;
  padding: 12px 14px 4px;
  font-family: var(--font-sans); font-size: 14px;
  resize: none;
  min-height: 44px; max-height: 200px; line-height: 1.55;
}
#input-area textarea::placeholder { color: var(--text-dim); }
#input-area textarea:disabled { opacity: 0.5; }
.composer-bar {
  display: flex; align-items: center;
  gap: 8px; padding: 5px 7px 7px 9px;
}
.slash-btn {
  display: inline-flex; align-items: center; gap: 4px;
  flex-shrink: 0; height: 22px; padding: 0 7px;
  border-radius: 4px; border: 1px solid transparent;
  background: transparent; color: var(--text-dim);
  font-family: inherit; font-size: 11px; cursor: pointer;
  transition: color 0.12s ease, background 0.12s ease;
}
.slash-btn:hover {
  color: var(--text-bright); background: var(--surface-hover);
}
.slash-btn .slash-icon { font-family: var(--font-mono); font-weight: 600; font-size: 12px; }
.composer-hint {
  flex: 1; font-size: 11px; color: var(--text-dim); opacity: 0.85;
  user-select: none;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#send-btn {
  background: var(--accent);
  color: #ffffff;
  border: none; border-radius: 5px;
  padding: 5px 14px; cursor: pointer;
  font-family: var(--font-sans); font-size: 12.5px; font-weight: 500;
  white-space: nowrap; flex-shrink: 0;
  transition: filter 0.12s ease;
}
#send-btn:hover:not(:disabled) { filter: brightness(1.12); }
#send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

.cursor { animation: blink 1.05s step-end infinite; color: var(--text); }
@keyframes blink { 50% { opacity: 0; } }
.done-indicator {
  color: var(--text-dim); font-size: 11.5px; text-align: center;
  margin: 18px 0 6px; font-family: var(--font-mono);
  opacity: 0.8;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ═══ 会话列表 ═══ */
#session-list { flex: 1; overflow-y: auto; padding: 8px; }
#session-list::-webkit-scrollbar { width: 5px; }
#session-list::-webkit-scrollbar-track { background: transparent; }
#session-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.session-item {
  position: relative;
  display: flex; align-items: center; gap: 8px;
  padding: 7px 8px 7px 10px; border-radius: 4px; cursor: pointer;
  margin-bottom: 1px;
  color: var(--text-dim);
  transition: background 0.1s ease;
}
.session-main { flex: 1; min-width: 0; }
.session-title {
  font-size: 12.5px; color: var(--text); line-height: 1.4;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.session-meta {
  font-size: 11px; color: var(--text-dim);
  margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.session-item:hover { background: var(--surface-hover); }
.session-item.active { background: var(--surface); }
.session-item.active::before {
  content: '';
  position: absolute; left: 0; top: 6px; bottom: 6px; width: 2px;
  border-radius: 1px; background: var(--accent);
}
.session-item.active .session-title { color: var(--text-bright); }
.session-del {
  flex-shrink: 0; width: 18px; height: 18px;
  display: flex; align-items: center; justify-content: center;
  border: none; border-radius: 3px;
  background: transparent; color: var(--text-dim);
  font-size: 14px; line-height: 1; cursor: pointer; padding: 0;
  opacity: 0;
  transition: opacity 0.1s ease, color 0.1s ease, background 0.1s ease;
}
.session-item:hover .session-del { opacity: 1; }
.session-del:hover {
  color: var(--red);
  background: rgba(241, 76, 76, 0.14);
}
.session-del.armed {
  color: #ffffff; background: var(--red);
  opacity: 1; font-size: 11px;
}
.session-empty {
  padding: 22px 12px; text-align: center;
  color: var(--text-dim); font-size: 12px;
}

/* ═══ 主题切换（顶部状态栏内）═══ */
.theme-toggle {
  display: flex; gap: 1px;
  border: 1px solid var(--border); border-radius: 5px;
  overflow: hidden;
}
.theme-btn {
  padding: 3px 9px;
  border: none; border-radius: 0;
  cursor: pointer; font-family: var(--font-sans);
  font-size: 11px; font-weight: 500;
  background: transparent; color: var(--text-dim);
  transition: background 0.12s ease, color 0.12s ease;
}
.theme-btn:hover { color: var(--text-bright); background: var(--surface-hover); }
.theme-btn.active {
  background: var(--surface);
  color: var(--text-bright);
}
.new-session-btn {
  padding: 4px 10px; border-radius: 4px;
  border: 1px solid var(--border-strong);
  cursor: pointer; font-family: var(--font-sans);
  font-size: 11.5px; font-weight: 500;
  background: transparent; color: var(--text);
  white-space: nowrap;
  transition: background 0.12s ease, border-color 0.12s ease;
}
.new-session-btn:hover {
  background: var(--surface-hover);
  border-color: #4a4a4a;
}
.session-count {
  font-size: 10.5px; color: var(--text-dim);
  padding: 10px 12px 2px; letter-spacing: 0.5px;
  text-transform: uppercase; font-weight: 500;
}

/* ═══ 历史面板 ═══ */
#history-panel {
  display: none;
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg);
  z-index: 10;
  flex-direction: column;
  animation: fadeUp 0.15s ease both;
}
#history-panel.show { display: flex; }
#history-header {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 16px; border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#history-header .title {
  font-size: 13px; color: var(--text-bright); font-weight: 500;
}
#history-close {
  padding: 5px 11px; border-radius: 4px;
  border: 1px solid var(--border-strong);
  cursor: pointer; font-family: var(--font-sans);
  font-size: 12px; font-weight: 500;
  background: transparent; color: var(--text-dim);
  margin-left: auto;
  transition: background 0.12s ease, color 0.12s ease;
}
#history-close:hover { background: var(--surface-hover); color: var(--text); }
#history-body {
  flex: 1; overflow-y: auto;
  padding: 20px max(20px, calc((100% - 780px) / 2));
}
#history-body::-webkit-scrollbar { width: 10px; }
#history-body::-webkit-scrollbar-track { background: transparent; }
#history-body::-webkit-scrollbar-thumb {
  background: var(--border-strong); border-radius: 5px;
  border: 3px solid transparent; background-clip: content-box;
}

@media (max-width: 900px) {
  .sidebar { display: none; }
  #messages { padding: 20px 16px 14px; }
  #input-area { padding: 12px 16px 14px; }
  #slash-menu { left: 16px; right: 16px; }
  .composer-hint { display: none; }
  .composer-bar { justify-content: flex-end; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  #messages { scroll-behavior: auto; }
}
</style>
</head>
<body>
<div id="app">

  <!-- ═══ 左栏：会话 ═══ -->
  <div class="sidebar" id="left-sidebar">
    <div class="sidebar-header">
      <span class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 2.6 20.6 7.4v9.2L12 21.4 3.4 16.6V7.4z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <circle cx="12" cy="12" r="2.7" fill="currentColor" opacity="0.9"/>
        </svg>
        <span>MewAgent</span>
      </span>
      <button class="new-session-btn" onclick="newSession()">+ New</button>
    </div>
    <div class="session-count" id="session-count"></div>
    <div id="session-list">
      <div class="session-empty">Loading...</div>
    </div>
  </div>

  <!-- ═══ 中间：对话 ═══ -->
  <div id="center" style="position:relative;">
    <div id="status-bar">
      <div id="session-label" style="color:var(--text-dim);font-size:12px;"></div>
      <div class="info">
        <div class="theme-toggle compact">
          <button class="theme-btn active" data-theme-val="dark" onclick="setTheme('dark')">Dark</button>
          <button class="theme-btn" data-theme-val="light" onclick="setTheme('light')">Light</button>
        </div>
        <span id="conn-status"><span class="dot disconnected"></span>Disconnected</span>
      </div>
    </div>

    <!-- ═══ 历史记录覆盖层 ═══ -->
    <div id="history-panel">
      <div id="history-header">
        <span class="title" id="history-title">Session</span>
        <button id="history-close" onclick="closeHistory()">✕ Close</button>
      </div>
      <div id="history-body"></div>
    </div>

    <div id="messages"></div>
    <div id="input-area" style="position:relative;">
      <div id="slash-menu"></div>
      <div class="composer">
        <textarea id="input" placeholder="Send a message..." rows="1"></textarea>
        <div class="composer-bar">
          <button type="button" class="slash-btn" onclick="openCmdMenu()" title="查看可用命令">
            <span class="slash-icon">/</span><span>命令</span>
          </button>
          <span class="composer-hint">Enter 发送 · Shift + Enter 换行</span>
          <button id="send-btn">Send</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 右栏已移除：命令改由输入框内的斜杠菜单承载，主题切换收进顶部状态栏 -->
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
// ─── DOM refs ───
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const connStatus = document.getElementById('conn-status');
const slashMenu = document.getElementById('slash-menu');
const sessionList = document.getElementById('session-list');
const sessionCount = document.getElementById('session-count');
const sessionLabel = document.getElementById('session-label');
const historyPanel = document.getElementById('history-panel');
const historyBody = document.getElementById('history-body');
const historyTitle = document.getElementById('history-title');

// ─── State ───
let ws = null, streaming = false, allCommands = [], slashCursor = 0, slashFiltered = [];
let currentAssistantEl = null, currentStreamText = '', currentThinkingEl = null, currentThinkingText = '';
let autoScroll = true, pingTimer = null, connectedOnce = false;
let allSessions = [], currentSessionId = null;

// ─── Theme ───
function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('mewagent-theme', theme);
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.themeVal === theme));
}
(function(){const s=localStorage.getItem('mewagent-theme')||(window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');setTheme(s)})();

// ─── Markdown ───
if(typeof marked!=='undefined')marked.setOptions({breaks:true,gfm:true});
function renderMarkdown(t){if(typeof marked!=='undefined')try{return marked.parse(t)}catch(e){}return escapeHtml(t)}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// ─── WebSocket ───
function connect(){
  if(pingTimer){clearInterval(pingTimer);pingTimer=null}
  if(ws){try{ws.onclose=null;ws.close()}catch(e){}ws=null}
  const proto=location.protocol==='https:'?'wss:':'ws:';
  ws=new WebSocket(proto+'//'+location.host+'/ws');
  ws.onopen=()=>{
    connStatus.innerHTML='<span class="dot connected"></span>Connected';
    pingTimer=setInterval(()=>{if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'ping',data:{}}))},10000);
    ws.send(JSON.stringify({type:'list_sessions',data:{}}));
  };
  ws.onclose=()=>{
    connStatus.innerHTML='<span class="dot disconnected"></span>Reconnecting...';
    if(pingTimer){clearInterval(pingTimer);pingTimer=null}
    setTimeout(connect,3000);
  };
  ws.onerror=()=>{};
  ws.onmessage=(evt)=>{const msg=JSON.parse(evt.data);handleMessage(msg)};
}

// ─── Message handler ───
function handleMessage(msg){
  switch(msg.type){
    case 'connected':
      currentSessionId=msg.data.session;
      sessionLabel.textContent=formatSessionLabel(msg.data.session);
      sessionLabel.title=msg.data.session+'  ·  '+msg.data.cwd;
      if(!connectedOnce){showWelcome();connectedOnce=true}
      break;
    case 'sessions':
      allSessions=msg.data||[];
      renderSessions();
      break;
    case 'commands':
      allCommands=msg.data||[];
      renderCommands();
      break;
    case 'system': addSystem(msg.data.message); break;
    case 'clear': messagesEl.innerHTML=''; addSystem('Conversation cleared.'); break;
    case 'command_done': streaming=false; updateUI(); break;
    case 'replay_user': addUser(msg.data.content); break;
    case 'replay_assistant':{const el=addAssistant('');updateAssistant(el,msg.data.content,false);break;}
    case 'stream_text':
      if(currentThinkingEl){currentThinkingEl.querySelector('.thinking-header span:last-child').textContent='💭 Thought';currentThinkingEl=null;currentThinkingText=''}
      if(!currentAssistantEl){currentAssistantEl=addAssistant('');currentStreamText=''}
      currentStreamText+=msg.data.text;
      updateAssistant(currentAssistantEl,currentStreamText,true);
      break;
    case 'stream_end':
      if(currentAssistantEl){updateAssistant(currentAssistantEl,currentStreamText,false)}
      currentAssistantEl=null;currentStreamText='';
      break;
    case 'thinking_text':
      if(!currentThinkingEl){currentThinkingEl=addThinking();currentThinkingText=''}
      currentThinkingText+=msg.data.text;
      currentThinkingEl.querySelector('.thinking-body').textContent=currentThinkingText;
      break;
    case 'tool_use':
      if(currentThinkingEl){currentThinkingEl.querySelector('.thinking-header span:last-child').textContent='💭 Thought';currentThinkingEl=null;currentThinkingText=''}
      addToolUse(msg.data);
      break;
    case 'tool_result': updateToolResult(msg.data); break;
    case 'permission_request': addPermissionDialog(msg.data); break;
    case 'ask_user': addAskUserDialog(msg.data); break;
    case 'loop_complete':
      if(currentAssistantEl){updateAssistant(currentAssistantEl,currentStreamText,false);currentAssistantEl=null;currentStreamText=''}
      currentThinkingEl=null;currentThinkingText='';
      const el=document.createElement('div');el.className='done-indicator';el.textContent='✻ Done in '+msg.data.elapsed.toFixed(1)+'s';
      messagesEl.appendChild(el);streaming=false;updateUI();scrollToBottom();
      if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'list_sessions',data:{}}));
      break;
    case 'usage': break;
    case 'error': addError(msg.data.message);streaming=false;updateUI();break;
    case 'compact': addSystem('⟳ '+msg.data.message);break;
    case 'retry': addSystem('↻ Retrying: '+msg.data.reason);break;
    case 'session_history':
      showSessionHistory(msg.data);
      break;
    case 'session_deleted':
      if(msg.data&&msg.data.id===currentSessionId){currentSessionId=null;closeHistory()}
      break;
  }
}

// ─── Session List (IDs only) ───
function renderSessions(){
  sessionCount.textContent=allSessions.length+' session'+(allSessions.length!==1?'s':'');
  if(allSessions.length===0){
    sessionList.innerHTML='<div class="session-empty">No sessions yet</div>';return;
  }
  sessionList.innerHTML=allSessions.map(s=>{
    const active=s.id===currentSessionId?'active':'';
    const title=s.firstMessage?s.firstMessage:s.id;
    const meta=(s.relativeTime||'')+(s.messageCount?' · '+s.messageCount+' msg'+(s.messageCount!==1?'s':''):'');
    return '<div class="session-item '+active+'" title="'+escapeHtml(s.id)+'" onclick="viewSession(\''+s.id+'\')">'
      +'<div class="session-main">'
        +'<div class="session-title">'+escapeHtml(title)+'</div>'
        +'<div class="session-meta">'+escapeHtml(meta)+'</div>'
      +'</div>'
      +'<button class="session-del" title="删除会话" onclick="event.stopPropagation();askDelete(\''+s.id+'\',this)">×</button>'
      +'</div>';
  }).join('');
}

// 删除会话：第一次点击进入待确认态，3 秒内再点一次才真正删除
function askDelete(id,btn){
  if(btn.dataset.armed==='1'){
    btn.dataset.armed='';btn.classList.remove('armed');
    btn.textContent='×';btn.title='删除会话';
    if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'delete_session',data:{id}}));
    return;
  }
  btn.dataset.armed='1';btn.classList.add('armed');
  btn.textContent='✓';btn.title='再次点击确认删除';
  setTimeout(()=>{
    if(btn.isConnected&&btn.dataset.armed==='1'){
      btn.dataset.armed='';btn.classList.remove('armed');
      btn.textContent='×';btn.title='删除会话';
    }
  },3000);
}

function viewSession(id){
  if(ws&&ws.readyState===WebSocket.OPEN){
    ws.send(JSON.stringify({type:'get_session_history',data:{id}}));
  }
}

function closeHistory(){
  historyPanel.classList.remove('show');
}

function showSessionHistory(data){
  const msgs=data.messages||[];
  historyTitle.textContent='Session: '+data.id;
  historyBody.innerHTML='';
  if(msgs.length===0){
    historyBody.innerHTML='<div style="text-align:center;color:var(--text-dim);padding:40px;font-size:13px;">Empty session</div>';
  }else{
    msgs.forEach(m=>{
      const div=document.createElement('div');
      if(m.role==='user'){
        div.style.cssText='display:flex;justify-content:flex-end;margin-bottom:14px;';
        const bubble=document.createElement('div');
        bubble.style.cssText='max-width:80%;padding:11px 16px;background:var(--user-bg);border:1px solid var(--user-border);border-radius:16px 16px 5px 16px;color:var(--text-bright);line-height:1.6;white-space:pre-wrap;word-break:break-word;';
        bubble.textContent=m.content;
        div.appendChild(bubble);
      }else{
        div.style.cssText='display:flex;justify-content:flex-start;margin-bottom:14px;';
        const bubble=document.createElement('div');
        bubble.style.cssText='max-width:88%;padding:13px 18px;background:var(--assistant-bg);border:1px solid var(--assistant-border);border-radius:5px 16px 16px 16px;color:var(--text);line-height:1.68;word-break:break-word;';
        bubble.innerHTML=renderMarkdown(m.content);
        div.appendChild(bubble);
      }
      historyBody.appendChild(div);
    });
  }
  historyPanel.classList.add('show');
}

// ─── Commands ───
// 命令列表现在只用于输入框内的斜杠菜单，不再渲染到侧栏
function renderCommands(){}

// ─── Message renderers ───
function addUser(text){
  clearWelcome();
  const div=document.createElement('div');div.className='msg msg-user';
  div.innerHTML='<div class="bubble">'+escapeHtml(text)+'</div>';
  messagesEl.appendChild(div);scrollToBottom();
}
function addAssistant(text){
  const div=document.createElement('div');div.className='msg msg-assistant';
  div.innerHTML='<div class="bubble"></div>';
  messagesEl.appendChild(div);scrollToBottom();
  return div;
}
function updateAssistant(el,text,isStreaming){
  const contentEl=el.querySelector('.bubble');
  const thinkMatch=text.match(/^<think>([\s\S]*?)<\/think>\s*([\s\S]*)$/);
  if(thinkMatch){
    const thinkText=thinkMatch[1].trim(),bodyText=thinkMatch[2].trim();
    let html='';
    if(thinkText)html+='<div class="thinking-block"><div class="thinking-header" onclick="toggleThinking(this)"><span class="icon">▶</span><span>💭 Thought</span></div><div class="thinking-body">'+escapeHtml(thinkText)+'</div></div>';
    if(bodyText)html+=renderMarkdown(bodyText);
    if(isStreaming)html+='<span class="cursor">▎</span>';
    contentEl.innerHTML=html;
  }else if(text.startsWith('<think>')&&isStreaming){
    const thinkBody=text.replace(/^<think>\s*/,'');
    let html='<div class="thinking-block"><div class="thinking-header" onclick="toggleThinking(this)"><span class="icon">▶</span><span>💭 Thinking...</span></div><div class="thinking-body">'+escapeHtml(thinkBody)+'</div></div><span class="cursor">▎</span>';
    contentEl.innerHTML=html;
  }else{
    let html=renderMarkdown(text);
    if(isStreaming)html+='<span class="cursor">▎</span>';
    contentEl.innerHTML=html;
  }
  scrollToBottom();
}
function addThinking(){
  const div=document.createElement('div');div.className='thinking-block';
  div.innerHTML='<div class="thinking-header" onclick="toggleThinking(this)"><span class="icon">▶</span><span>💭 Thinking...</span></div><div class="thinking-body"></div>';
  messagesEl.appendChild(div);scrollToBottom();return div;
}
function toggleThinking(header){header.querySelector('.icon').classList.toggle('expanded');header.nextElementSibling.classList.toggle('show')}

// ─── 欢迎引导（替代裸系统消息的空状态）───
const WELCOME_TIPS=['概述一下这个项目的架构','检查代码里潜在的问题','帮我给核心模块补测试'];
function formatSessionLabel(id){
  const m=/^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})/.exec(id||'');
  return m ? (m[2]+'-'+m[3]+' '+m[4]+':'+m[5]) : (id||'');
}
function showWelcome(){
  if(messagesEl.querySelector('.welcome'))return;
  const w=document.createElement('div');
  w.className='welcome';
  w.innerHTML='<div class="welcome-card">'
    +'<div class="welcome-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true">'
    +'<path d="M12 2.6 20.6 7.4v9.2L12 21.4 3.4 16.6V7.4z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>'
    +'<circle cx="12" cy="12" r="2.7" fill="currentColor" opacity="0.92"/></svg></div>'
    +'<h2>有什么可以帮你？</h2>'
    +'<p>描述一个任务，我会读代码、改文件、跑命令把它做完。</p>'
    +'<div class="welcome-tips">'+WELCOME_TIPS.map((t,i)=>'<button type="button" onclick="useTip('+i+')">'+escapeHtml(t)+'</button>').join('')+'</div>'
    +'</div>';
  messagesEl.appendChild(w);
}
function clearWelcome(){const w=messagesEl.querySelector('.welcome');if(w)w.remove()}
function useTip(i){inputEl.value=WELCOME_TIPS[i];inputEl.focus()}

function addSystem(t){clearWelcome();const d=document.createElement('div');d.className='msg msg-system';d.textContent=t;messagesEl.appendChild(d);scrollToBottom()}
function addError(t){clearWelcome();const d=document.createElement('div');d.className='msg msg-error';d.textContent='✖ '+t;messagesEl.appendChild(d);scrollToBottom()}

// ─── Tool blocks ───
const toolElements={};
function addToolUse(data){
  const div=document.createElement('div');div.className='tool-block';
  const argsStr=data.args?JSON.stringify(data.args,null,2):'';
  let argsPreview='';
  if(data.args){if(data.args.command)argsPreview=data.args.command;else if(data.args.file_path)argsPreview=data.args.file_path;else if(data.args.pattern)argsPreview=data.args.pattern;else if(data.args.path)argsPreview=data.args.path}
  div.innerHTML='<div class="tool-header" onclick="toggleTool(this)"><span class="icon">▶</span><span class="name">'+escapeHtml(data.toolName)+'</span>'+(argsPreview?'<span style="color:var(--text-dim);font-size:12px;margin-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:500px;">'+escapeHtml(argsPreview)+'</span>':'')+'<span class="status loading">⏳ running...</span></div><div class="tool-body">'+(argsStr?'<div style="color:var(--blue);margin-bottom:8px;">Args:\n'+escapeHtml(argsStr)+'</div>':'')+'<div class="tool-output"></div></div>';
  messagesEl.appendChild(div);toolElements[data.toolName+'_'+(data.toolId||'')]=div;scrollToBottom();
}
function updateToolResult(data){
  const key=data.toolName+'_'+(data.toolId||''),div=toolElements[key];
  if(div){
    const statusEl=div.querySelector('.status');
    if(data.isError){statusEl.className='status err';statusEl.textContent='✗ '+data.elapsed.toFixed(1)+'s'}
    else{statusEl.className='status ok';statusEl.textContent='✓ '+data.elapsed.toFixed(1)+'s'}
    const outputEl=div.querySelector('.tool-output');
    if(data.output)outputEl.textContent=data.output.length>5000?data.output.substring(0,5000)+'\n... (truncated)':data.output;
    delete toolElements[key];
  }else{
    const block=document.createElement('div');block.className='tool-block';
    const status=data.isError?'✗':'✓',statusClass=data.isError?'err':'ok';
    block.innerHTML='<div class="tool-header" onclick="toggleTool(this)"><span class="icon">▶</span><span class="name">'+escapeHtml(data.toolName)+'</span><span class="status '+statusClass+'">'+status+' '+data.elapsed.toFixed(1)+'s</span></div><div class="tool-body">'+escapeHtml(data.output||'')+'</div>';
    messagesEl.appendChild(block);
  }
  scrollToBottom();
}
function toggleTool(header){header.querySelector('.icon').classList.toggle('expanded');header.nextElementSibling.classList.toggle('show')}

// ─── Dialogs ───
function addPermissionDialog(data){
  const div=document.createElement('div');div.className='perm-dialog';div.id='perm-'+data.id;
  div.innerHTML='<div class="title">🔒 Permission Required: '+escapeHtml(data.toolName)+'</div><div class="desc">'+escapeHtml(data.description)+'</div><div class="actions"><button class="btn-allow" onclick="respondPerm(\''+data.id+'\',\'allow\')">Allow</button><button class="btn-always" onclick="respondPerm(\''+data.id+'\',\'allowAlways\')">Allow Always</button><button class="btn-deny" onclick="respondPerm(\''+data.id+'\',\'deny\')">Deny</button></div>';
  messagesEl.appendChild(div);scrollToBottom();
}
function respondPerm(id,r){ws.send(JSON.stringify({type:'permission_response',data:{id,response:r}}));const el=document.getElementById('perm-'+id);if(el)el.innerHTML='<div style="color:var(--text-dim)">🔒 Permission: '+r+'</div>'}
function addAskUserDialog(data){
  const div=document.createElement('div');div.className='perm-dialog';div.id='ask-'+data.id;
  let html='<div class="title">❓ Question</div>';(data.questions||[]).forEach((q,qi)=>{html+='<div style="margin-bottom:12px;"><div style="margin-bottom:6px;color:var(--text-bright);">'+escapeHtml(q.question||q.Text||'')+'</div>';(q.options||q.Options||[]).forEach(opt=>{const label=opt.label||opt.Label||'',desc=opt.description||opt.Description||'';html+='<label style="display:block;margin:4px 0;cursor:pointer;"><input type="radio" name="ask_'+data.id+'_'+qi+'" value="'+escapeHtml(label)+'"> <span style="color:var(--blue)">'+escapeHtml(label)+'</span>'+(desc?' <span style="color:var(--text-dim);font-size:12px;">— '+escapeHtml(desc)+'</span>':'')+'</label>'});html+='<label style="display:block;margin:4px 0;cursor:pointer;"><input type="radio" name="ask_'+data.id+'_'+qi+'" value="__other__"> <span style="color:var(--text-dim)">Other: </span><input type="text" id="ask_other_'+data.id+'_'+qi+'" style="background:var(--bg-input);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-family:inherit;font-size:13px;width:200px;"></label></div>'});
  html+='<div class="actions"><button class="btn-allow" onclick="respondAsk(\''+data.id+'\','+(data.questions||[]).length+')">Submit</button></div>';
  div.innerHTML=html;messagesEl.appendChild(div);scrollToBottom();
}
function respondAsk(id,qCount){
  const answers={};for(let i=0;i<qCount;i++){const radios=document.querySelectorAll('input[name="ask_'+id+'_'+i+'"]');let val='';radios.forEach(r=>{if(r.checked)val=r.value==='__other__'?document.getElementById('ask_other_'+id+'_'+i).value:r.value});answers['question_'+i]=val}
  ws.send(JSON.stringify({type:'ask_user_response',data:{id,answers}}));const el=document.getElementById('ask-'+id);if(el)el.innerHTML='<div style="color:var(--text-dim)">✓ Answered</div>'
}

// ─── Scroll ───
messagesEl.addEventListener('scroll',()=>{const{scrollTop,scrollHeight,clientHeight}=messagesEl;autoScroll=scrollHeight-scrollTop-clientHeight<60});
function scrollToBottom(){if(autoScroll)requestAnimationFrame(()=>{messagesEl.scrollTop=messagesEl.scrollHeight})}

// ─── Input ───
function runCommand(text){if(!text||streaming)return;addUser(text);ws.send(JSON.stringify({type:'user_message',data:{content:text}}));inputEl.value='';inputEl.style.height='auto';streaming=true;updateUI()}
function sendMessage(){if(slashMenu.classList.contains('show'))hideSlashMenu();runCommand(inputEl.value.trim())}
function updateUI(){sendBtn.disabled=streaming;inputEl.disabled=streaming;if(!streaming)inputEl.focus()}

// ─── Slash menu ───
function openCmdMenu(){
  if(!allCommands.length)return;
  if(!inputEl.value.startsWith('/'))inputEl.value='/';
  inputEl.focus();
  inputEl.dispatchEvent(new Event('input'));
}
function showSlashMenu(f){const p=f.toLowerCase();slashFiltered=allCommands.filter(c=>c.name.startsWith(p));if(!slashFiltered.length){hideSlashMenu();return}slashCursor=0;renderSlashMenu();slashMenu.classList.add('show')}
function hideSlashMenu(){slashMenu.classList.remove('show');slashFiltered=[];slashCursor=0}
function renderSlashMenu(){slashMenu.innerHTML=slashFiltered.map((c,i)=>'<div class="slash-item'+(i===slashCursor?' active':'')+'" data-idx="'+i+'"><span class="cmd-name">/'+escapeHtml(c.name)+'</span><span class="cmd-desc">'+escapeHtml(c.description)+'</span></div>').join('');slashMenu.querySelectorAll('.slash-item').forEach(el=>{el.addEventListener('mousedown',(e)=>{e.preventDefault();selectSlashItem(parseInt(el.dataset.idx))})});const ae=slashMenu.querySelector('.active');if(ae)ae.scrollIntoView({block:'nearest'})}
// 这些命令不需要参数，选中后直接执行；其余命令填入输入框等待补参数
// 不需要参数、选中即执行；clear 有破坏性，故意留在外面要求再确认一次
const NO_ARG_CMDS=new Set(['compact','status','help','mcp','review','plan']);
function selectSlashItem(i){
  const c=slashFiltered[i];if(!c)return;
  hideSlashMenu();
  if(NO_ARG_CMDS.has(c.name)){
    inputEl.value='';
    runCommand('/'+c.name);
  }else{
    inputEl.value='/'+c.name+' ';
    inputEl.focus();
  }
}
inputEl.addEventListener('keydown',(e)=>{if(slashMenu.classList.contains('show')){if(e.key==='ArrowDown'){e.preventDefault();slashCursor=Math.min(slashCursor+1,slashFiltered.length-1);renderSlashMenu();return}if(e.key==='ArrowUp'){e.preventDefault();slashCursor=Math.max(slashCursor-1,0);renderSlashMenu();return}if(e.key==='Tab'||e.key==='Enter'&&!e.shiftKey){e.preventDefault();selectSlashItem(slashCursor);return}if(e.key==='Escape'){e.preventDefault();hideSlashMenu();return}}if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}})
inputEl.addEventListener('input',()=>{inputEl.style.height='auto';inputEl.style.height=Math.min(inputEl.scrollHeight,200)+'px';const v=inputEl.value;if(v.startsWith('/')&&!v.includes('\n')){const p=v.substring(1).split(' ')[0];if(!v.includes(' '))showSlashMenu(p);else hideSlashMenu()}else hideSlashMenu()})
sendBtn.addEventListener('click',sendMessage);

// ─── New session ───
function newSession(){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'new_session'}))}

// ─── Start ───
connect();inputEl.focus();
</script>
</body>
