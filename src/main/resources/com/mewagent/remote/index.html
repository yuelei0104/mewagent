<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0c10">
<title>MewAgent</title>
<style>
    /* ══════════════════════════════════════════════════════════
       MewAgent · 编辑器风格设计系统
       参考 Cursor / Zed / GitHub Dark 的信息密度与配色，
       等宽字体承载代码，无衬线承载叙述，强调色只给交互焦点。
       ══════════════════════════════════════════════════════════ */

    :root {
      --mono: "JetBrains Mono", "Cascadia Code", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace;
      --sans: "Segoe UI Variable Text", "Segoe UI", Inter, -apple-system, "PingFang SC", "Microsoft YaHei UI", sans-serif;

      /* 暗色：偏蓝的近黑，非纯黑，避免 OLED 上的脏灰 */
      --bg: #0b0e13;
      --bg-2: #0e1218;
      --panel: #121821;
      --panel-2: #161d27;
      --panel-3: #1b2430;
      --code: #0a0d12;
      --border: #1d2631;
      --border-strong: #2a3644;
      --text: #c6d0dc;
      --dim: #7e8b9c;
      --bright: #f0f4f9;
      --accent: #4c9aff;
      --accent-dim: rgba(76, 154, 255, .14);
      --green: #3fb950;
      --green-dim: rgba(63, 185, 80, .13);
      --red: #f85149;
      --red-dim: rgba(248, 81, 73, .13);
      --yellow: #d29922;
      --yellow-dim: rgba(210, 153, 34, .13);
      --purple: #b78cff;
      --radius: 8px;
      --radius-sm: 6px;
      --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
      --shadow-2: 0 8px 28px rgba(0, 0, 0, .45);
      --shadow-3: 0 24px 60px rgba(0, 0, 0, .55);
      --sidebar-w: 256px;
      --content-w: 840px;
    }

    html[data-theme="light"] {
      --bg: #ffffff;
      --bg-2: #f7f8fa;
      --panel: #ffffff;
      --panel-2: #f2f4f7;
      --panel-3: #e9edf2;
      --code: #f6f8fa;
      --border: #e0e6ed;
      --border-strong: #c9d3de;
      --text: #2b333d;
      --dim: #68737f;
      --bright: #0d141c;
      --accent: #0a63d6;
      --accent-dim: rgba(10, 99, 214, .1);
      --green: #1a7f37;
      --green-dim: rgba(26, 127, 55, .1);
      --red: #cf2226;
      --red-dim: rgba(207, 34, 38, .1);
      --yellow: #9a6700;
      --yellow-dim: rgba(154, 103, 0, .1);
      --purple: #8250df;
      --shadow-1: 0 1px 2px rgba(16, 24, 40, .06);
      --shadow-2: 0 8px 24px rgba(16, 24, 40, .1);
      --shadow-3: 0 24px 60px rgba(16, 24, 40, .16);
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    ::selection { background: var(--accent-dim); color: var(--bright); }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 6px;
      border: 3px solid var(--bg);
    }
    ::-webkit-scrollbar-thumb:hover { background: #3a4a5c; }

    button { font-family: inherit; font-size: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    input, textarea { font-family: inherit; color: inherit; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    kbd {
      display: inline-block;
      font-family: var(--mono);
      font-size: 10px;
      line-height: 1;
      padding: 3px 5px;
      color: var(--dim);
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-bottom-color: var(--border-strong);
      border-radius: 4px;
    }

    #app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ═══ 侧栏 ═══ */
    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      display: flex;
      flex-direction: column;
      background: var(--bg-2);
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 48px;
      padding: 0 12px 0 14px;
      flex: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .brand-badge {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      color: #fff;
      background: linear-gradient(145deg, #4c9aff, #7b5cff);
      box-shadow: 0 2px 8px rgba(76, 154, 255, .35);
      flex: none;
    }

    .brand-badge svg { width: 14px; height: 14px; }

    .brand-name {
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: .01em;
      color: var(--bright);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .new-session-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 24px;
      padding: 0 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--dim);
      font-size: 11.5px;
      transition: all .12s ease;
    }

    .new-session-btn:hover {
      color: var(--bright);
      border-color: var(--border-strong);
      background: var(--panel-2);
    }

    .new-session-btn .plus { font-size: 13px; line-height: 1; margin-top: -1px; }

    /* 工作目录 + 分支 */
    .workspace {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 26px;
      margin: 0 10px 6px;
      padding: 0 8px;
      border-radius: 5px;
      color: var(--dim);
      font-family: var(--mono);
      font-size: 10.5px;
      background: var(--panel);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .workspace svg { width: 12px; height: 12px; flex: none; opacity: .8; }

    .workspace .ws-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    .workspace .ws-branch {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      color: var(--accent);
      opacity: .85;
      flex: none;
    }

    .session-search {
      position: relative;
      margin: 0 10px 8px;
      flex: none;
    }

    .session-search .search-icon {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--dim);
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .session-search .search-icon svg { width: 13px; height: 13px; }

    .session-search input {
      width: 100%;
      height: 28px;
      padding: 0 8px 0 27px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 12px;
      outline: none;
      transition: border-color .12s, box-shadow .12s;
    }

    .session-search input::placeholder { color: var(--dim); }

    .session-search input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
      background: var(--bg-2);
    }

    .session-search input::-webkit-search-cancel-button { -webkit-appearance: none; }

    .session-count {
      padding: 0 16px 6px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--dim);
      letter-spacing: .02em;
      flex: none;
    }

    #session-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 6px 12px;
    }

    .session-group {
      padding: 14px 10px 5px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--dim);
      opacity: .75;
    }

    .session-group:first-child { padding-top: 4px; }

    .session-item {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 7px 8px 7px 10px;
      margin-bottom: 1px;
      border-radius: 6px;
      cursor: pointer;
      transition: background .12s ease;
    }

    .session-item:hover { background: var(--panel); }

    .session-item.active { background: var(--panel-2); }

    .session-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 8px;
      bottom: 8px;
      width: 2px;
      border-radius: 2px;
      background: var(--accent);
    }

    .session-main { min-width: 0; flex: 1; }

    .session-title {
      font-size: 12.5px;
      line-height: 1.4;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session-item.active .session-title { color: var(--bright); }

    .session-meta {
      margin-top: 2px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session-del, .session-rename {
      position: absolute;
      right: 6px;
      top: 6px;
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      border-radius: 4px;
      color: var(--dim);
      opacity: 0;
      transition: opacity .12s, background .12s, color .12s;
      font-size: 12px;
      line-height: 1;
      background: var(--panel-2);
    }

    .session-rename { right: 30px; }

    .session-item:hover .session-del,
    .session-item:hover .session-rename { opacity: 1; }

    .session-del:hover { color: var(--red); background: var(--red-dim); }
    .session-rename:hover { color: var(--accent); background: var(--accent-dim); }

    .session-empty {
      padding: 28px 16px;
      text-align: center;
      color: var(--dim);
      font-size: 11.5px;
      line-height: 1.9;
    }

    .skeleton { padding: 9px 10px; }

    .skeleton .line {
      height: 9px;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--panel) 25%, var(--panel-2) 37%, var(--panel) 63%);
      background-size: 400% 100%;
      animation: shimmer 1.4s ease infinite;
      margin-bottom: 6px;
    }

    .skeleton .line.short { width: 42%; height: 7px; }

    @keyframes shimmer {
      0% { background-position: 100% 0; }
      100% { background-position: 0 0; }
    }

    /* ═══ 主区 ═══ */
    #center {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
      background: var(--bg);
    }

    /* 顶部：标题 + 操作 */
    #status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      height: 44px;
      padding: 0 14px 0 18px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      flex: none;
      z-index: 5;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .status-mark {
      display: grid;
      place-items: center;
      color: var(--accent);
      opacity: .9;
      flex: none;
    }

    .status-mark svg { width: 13px; height: 13px; }

    #session-label {
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .info {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: none;
    }

    .icon-btn {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      color: var(--dim);
      transition: background .12s, color .12s;
    }

    .icon-btn:hover { background: var(--panel-2); color: var(--bright); }
    .icon-btn svg { width: 14px; height: 14px; }

    .theme-toggle {
      display: inline-flex;
      padding: 2px;
      gap: 2px;
      border-radius: 7px;
      background: var(--panel);
      border: 1px solid var(--border);
    }

    .theme-btn {
      width: 24px;
      height: 20px;
      display: grid;
      place-items: center;
      border-radius: 5px;
      color: var(--dim);
      transition: all .12s;
    }

    .theme-btn svg { width: 12px; height: 12px; }
    .theme-btn:hover { color: var(--text); }
    .theme-btn.active { color: var(--bright); background: var(--panel-3); box-shadow: var(--shadow-1); }

    .conn-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 22px;
      padding: 0 8px;
      border-radius: 5px;
      border: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--dim);
      white-space: nowrap;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--dim);
      flex: none;
    }

    .dot.connected { background: var(--green); box-shadow: 0 0 6px rgba(63, 185, 80, .6); }
    .dot.disconnected { background: var(--red); }

    /* 消息流 */
    #messages {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px 0 20px;
      scroll-behavior: smooth;
    }

    /* 消息流是纵向 flex 容器，子项必须禁止收缩，否则内容多时卡片会被压扁 */
    #messages > * { flex: 0 0 auto; }

    .msg {
      width: 100%;
      max-width: var(--content-w);
      margin: 0 auto;
      padding: 0 28px;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: none; }
    }

    /* 用户消息：终端提示符风格 */
    .msg-user {
      display: flex;
      justify-content: flex-end;
      margin: 14px auto 6px;
    }

    .msg-user .bubble {
      position: relative;
      max-width: 82%;
      padding: 9px 13px 9px 26px;
      border-radius: var(--radius);
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--bright);
      font-size: 12.8px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .msg-user .bubble::before {
      content: '›';
      position: absolute;
      left: 11px;
      top: 8px;
      color: var(--accent);
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
    }

    /* 助手消息：左侧细导轨 */
    .msg-assistant {
      position: relative;
      padding: 8px 28px 8px 40px;
      margin-bottom: 2px;
    }

    .msg-assistant::before {
      content: '';
      position: absolute;
      left: 28px;
      top: 14px;
      bottom: 8px;
      width: 1px;
      background: linear-gradient(to bottom, var(--border-strong), transparent 92%);
    }

    .msg-assistant::after {
      content: '';
      position: absolute;
      left: 25px;
      top: 16px;
      width: 7px;
      height: 7px;
      border-radius: 2px;
      background: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .msg-assistant .bubble {
      font-size: 13px;
      line-height: 1.72;
      color: var(--text);
      overflow-wrap: anywhere;
    }

    /* 系统消息 */
    .msg-system {
      margin: 12px auto;
      padding: 6px 28px;
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--dim);
      white-space: pre-wrap;
      line-height: 1.65;
    }

    .msg-system.multi {
      width: calc(100% - 56px);
      max-width: calc(var(--content-w) - 56px);
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--text);
      white-space: pre-wrap;
    }

    .msg-error {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 10px auto;
      padding: 9px 14px;
      max-width: calc(var(--content-w) - 56px);
      border: 1px solid var(--red);
      border-radius: var(--radius);
      background: var(--red-dim);
    }

    .msg-error .err-text {
      flex: 1;
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--red);
      overflow-wrap: anywhere;
    }

    .retry-btn {
      flex: none;
      padding: 3px 10px;
      border-radius: 5px;
      border: 1px solid var(--red);
      color: var(--red);
      font-size: 11px;
      font-family: var(--mono);
      transition: background .12s;
    }

    .retry-btn:hover { background: rgba(248, 81, 73, .18); }

    .done-indicator {
      align-self: center;
      margin: 10px auto 14px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .06em;
      color: var(--dim);
      opacity: .7;
    }

    .cursor {
      display: inline-block;
      width: 7px;
      color: var(--accent);
      animation: blink 1.05s steps(2, start) infinite;
      margin-left: 1px;
    }

    @keyframes blink { to { visibility: hidden; } }

    /* ═══ Markdown 排版 ═══ */
    .bubble > *:first-child { margin-top: 0; }
    .bubble > *:last-child { margin-bottom: 0; }

    .bubble p { margin: 0 0 10px; }

    .bubble h1, .bubble h2, .bubble h3, .bubble h4 {
      margin: 18px 0 8px;
      color: var(--bright);
      font-weight: 600;
      line-height: 1.35;
    }

    .bubble h1 { font-size: 17px; }
    .bubble h2 { font-size: 15px; }
    .bubble h3 { font-size: 13.5px; }
    .bubble h4 { font-size: 13px; color: var(--text); }

    .bubble ul, .bubble ol { margin: 6px 0 10px; padding-left: 20px; }
    .bubble li { margin: 3px 0; }
    .bubble li::marker { color: var(--dim); }

    .bubble strong { color: var(--bright); font-weight: 600; }

    .bubble code {
      font-family: var(--mono);
      font-size: .88em;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--purple);
    }

    .bubble pre {
      margin: 10px 0;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--code);
      overflow: hidden;
    }

    .bubble pre code {
      display: block;
      padding: 11px 14px;
      overflow-x: auto;
      background: none;
      border: 0;
      border-radius: 0;
      font-size: 11.8px;
      line-height: 1.6;
      color: var(--text);
      tab-size: 2;
    }

    .bubble blockquote {
      margin: 10px 0;
      padding: 2px 0 2px 12px;
      border-left: 2px solid var(--border-strong);
      color: var(--dim);
    }

    .bubble table {
      width: 100%;
      margin: 12px 0;
      border-collapse: collapse;
      font-size: 12px;
    }

    .bubble th, .bubble td {
      padding: 6px 10px;
      border: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }

    .bubble th {
      background: var(--panel-2);
      color: var(--bright);
      font-weight: 600;
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .bubble tr:nth-child(even) td { background: var(--bg-2); }

    .bubble hr { border: 0; border-top: 1px solid var(--border); margin: 14px 0; }

    .bubble img { max-width: 100%; border-radius: var(--radius-sm); }

    /* ═══ 思考块 ═══ */
    .thinking-block {
      width: calc(100% - 56px);
      max-width: calc(var(--content-w) - 56px);
      margin: 8px auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel);
      overflow: hidden;
    }

    .thinking-header {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 11px;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--dim);
      user-select: none;
    }

    .thinking-header:hover { background: var(--panel-2); color: var(--text); }

    .thinking-header .icon {
      display: inline-block;
      font-size: 8px;
      transition: transform .15s;
      color: var(--dim);
    }

    .thinking-header .icon.expanded { transform: rotate(90deg); }

    .thinking-body {
      display: none;
      padding: 10px 13px;
      border-top: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 11.5px;
      line-height: 1.65;
      color: var(--dim);
      white-space: pre-wrap;
      max-height: 300px;
      overflow-y: auto;
    }

    .thinking-body.show { display: block; }

    /* ═══ 工具卡片：编辑器面板 ═══ */
    .tool-block {
      width: calc(100% - 56px);
      max-width: calc(var(--content-w) - 56px);
      margin: 9px auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel);
      overflow: hidden;
      transition: border-color .12s;
    }

    .tool-block:hover { border-color: var(--border-strong); }

    .tool-header {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 32px;
      padding: 0 10px;
      cursor: pointer;
      user-select: none;
      background: var(--panel-2);
      font-family: var(--mono);
      font-size: 11.5px;
    }

    .tool-header:hover { background: var(--panel-3); }

    .tool-header .icon {
      display: inline-block;
      font-size: 7px;
      color: var(--dim);
      transition: transform .15s;
      flex: none;
    }

    .tool-header .icon.expanded { transform: rotate(90deg); }

    .tool-icon {
      display: grid;
      place-items: center;
      width: 14px;
      height: 14px;
      flex: none;
      color: var(--accent);
    }

    .tool-icon svg { width: 13px; height: 13px; }

    .tool-icon[data-kind="read"] { color: var(--accent); }
    .tool-icon[data-kind="write"], .tool-icon[data-kind="edit"] { color: var(--purple); }
    .tool-icon[data-kind="bash"] { color: var(--green); }
    .tool-icon[data-kind="search"] { color: var(--yellow); }
    .tool-icon[data-kind="default"] { color: var(--dim); }

    .tool-header .name { color: var(--bright); font-weight: 600; flex: none; }

    .tool-file {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      max-width: 100%;
      padding: 1px 7px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--code);
      color: var(--dim);
      font-size: 10.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tool-file .file-dot {
      width: 5px;
      height: 5px;
      border-radius: 1px;
      background: var(--accent);
      opacity: .8;
      flex: none;
    }

    .tool-file .file-path { overflow: hidden; text-overflow: ellipsis; }

    .tool-args-preview {
      color: var(--dim);
      font-size: 10.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .tool-diff {
      display: inline-flex;
      gap: 6px;
      font-size: 10.5px;
      flex: none;
    }

    .tool-diff .add { color: var(--green); }
    .tool-diff .del { color: var(--red); }

    .status {
      margin-left: auto;
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      letter-spacing: .02em;
    }

    .status.loading { color: var(--yellow); background: var(--yellow-dim); }
    .status.ok { color: var(--green); background: var(--green-dim); }
    .status.err { color: var(--red); background: var(--red-dim); }

    .tool-body { display: none; background: var(--code); }
    .tool-body.show { display: block; }

    .tool-args {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.6;
      color: var(--dim);
      white-space: pre-wrap;
      overflow-x: auto;
      max-height: 200px;
    }

    .tool-output {
      margin: 0;
      padding: 8px 0;
      font-family: var(--mono);
      font-size: 11.3px;
      line-height: 1.6;
      color: var(--text);
      overflow: auto;
      max-height: 360px;
      counter-reset: code-line;
    }

    .code-line {
      display: block;
      position: relative;
      padding: 0 12px 0 46px;
      white-space: pre;
      counter-increment: code-line;
      min-height: 1.6em;
    }

    .code-line::before {
      content: counter(code-line);
      position: absolute;
      left: 0;
      width: 34px;
      text-align: right;
      color: var(--dim);
      opacity: .4;
      font-size: 10px;
      user-select: none;
    }

    .code-line.add { background: var(--green-dim); }
    .code-line.add::before { color: var(--green); opacity: .8; }
    .code-line.del { background: var(--red-dim); }
    .code-line.del::before { color: var(--red); opacity: .8; }
    .code-line.meta { color: var(--dim); font-style: italic; }

    /* ═══ 授权 / 询问 ═══ */
    .perm-dialog {
      width: calc(100% - 56px);
      max-width: calc(var(--content-w) - 56px);
      margin: 12px auto;
      padding: 12px 14px;
      border: 1px solid var(--yellow);
      border-left-width: 3px;
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow-1);
    }

    .perm-dialog .title {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--yellow);
    }

    .perm-dialog .title::before {
      content: '!';
      display: grid;
      place-items: center;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--yellow-dim);
      border: 1px solid var(--yellow);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
    }

    .perm-dialog .desc {
      margin-bottom: 10px;
      padding: 7px 9px;
      border-radius: 5px;
      background: var(--code);
      border: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.6;
      color: var(--text);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-height: 180px;
      overflow: auto;
    }

    .perm-dialog .actions { display: flex; gap: 7px; }

    .perm-dialog .actions button {
      height: 26px;
      padding: 0 12px;
      border-radius: 5px;
      font-size: 11.5px;
      font-weight: 500;
      border: 1px solid var(--border-strong);
      transition: all .12s;
    }

    .btn-allow { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-allow:hover { filter: brightness(1.1); }

    .btn-always { background: var(--panel-2); color: var(--text); }
    .btn-always:hover { background: var(--panel-3); }

    .btn-deny { background: transparent; color: var(--red); border-color: rgba(248, 81, 73, .4); }
    .btn-deny:hover { background: var(--red-dim); border-color: var(--red); }

    /* ═══ 欢迎页 ═══ */
    .welcome {
      margin: auto 0;
      padding: 20px 28px;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .welcome-card {
      max-width: 560px;
      text-align: left;
    }

    .welcome-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: #fff;
      background: linear-gradient(145deg, #4c9aff, #7b5cff);
      box-shadow: 0 6px 20px rgba(76, 154, 255, .3);
      margin-bottom: 16px;
    }

    .welcome-icon svg { width: 20px; height: 20px; }

    .welcome-card h2 {
      margin: 0 0 6px;
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -.01em;
      color: var(--bright);
    }

    .welcome-card > p {
      margin: 0 0 20px;
      font-size: 12.5px;
      color: var(--dim);
      line-height: 1.7;
    }

    .welcome-tips {
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .welcome-tips button {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 6px 8px;
      border-radius: 6px;
      text-align: left;
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--dim);
      transition: all .12s;
    }

    .welcome-tips button::before {
      content: '›';
      color: var(--accent);
      font-weight: 700;
      font-size: 13px;
      flex: none;
    }

    .welcome-tips button:hover { background: var(--panel); color: var(--bright); }

    /* ═══ 输入区 ═══ */
    #input-area {
      position: relative;
      flex: none;
      padding: 0 28px 12px;
      background: var(--bg);
    }

    .composer {
      max-width: calc(var(--content-w) - 56px);
      margin: 0 auto;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      background: var(--panel);
      box-shadow: var(--shadow-1);
      transition: border-color .14s, box-shadow .14s;
      overflow: hidden;
    }

    .composer:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim), var(--shadow-1);
    }

    #input {
      display: block;
      width: 100%;
      min-height: 44px;
      max-height: 210px;
      padding: 12px 14px 6px;
      border: 0;
      outline: none;
      resize: none;
      background: transparent;
      color: var(--bright);
      font-family: var(--mono);
      font-size: 12.5px;
      line-height: 1.6;
    }

    #input::placeholder { color: var(--dim); opacity: .85; }

    .composer-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px 6px 8px;
    }

    .slash-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 22px;
      padding: 0 6px;
      border-radius: 5px;
      color: var(--dim);
      font-family: var(--mono);
      font-size: 10.5px;
      transition: background .12s, color .12s;
    }

    .slash-btn:hover { background: var(--panel-2); color: var(--bright); }

    .slash-icon {
      display: grid;
      place-items: center;
      width: 15px;
      height: 15px;
      border-radius: 3px;
      background: var(--panel-3);
      font-size: 10px;
      font-weight: 700;
      color: var(--dim);
    }

    .composer-hint {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-left: auto;
      margin-right: 6px;
      font-size: 10px;
      color: var(--dim);
      opacity: .8;
    }

    .composer-hint .plus { opacity: .5; margin: 0 1px; }

    #send-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 26px;
      padding: 0 11px;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font-size: 11.5px;
      font-weight: 600;
      transition: filter .12s, opacity .12s;
    }

    #send-btn:hover { filter: brightness(1.1); }
    #send-btn:disabled { opacity: .4; cursor: not-allowed; filter: none; }
    #send-btn svg { width: 13px; height: 13px; }

    /* 附件条 */
    .attachment-bar {
      display: none;
      max-width: calc(var(--content-w) - 56px);
      margin: 0 auto 6px;
      gap: 6px;
      flex-wrap: wrap;
    }

    .attachment-bar.show { display: flex; }

    .attachment-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 24px;
      padding: 0 4px 0 8px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--panel);
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--text);
    }

    .att-name { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .att-size { color: var(--dim); }

    .att-remove {
      width: 16px;
      height: 16px;
      display: grid;
      place-items: center;
      border-radius: 3px;
      color: var(--dim);
      font-size: 12px;
      line-height: 1;
    }

    .att-remove:hover { background: var(--red-dim); color: var(--red); }

    /* ═══ 底部状态条（编辑器风格）═══ */
    #editor-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 24px;
      padding: 0 12px;
      flex: none;
      background: var(--panel);
      border-top: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 10px;
      color: var(--dim);
      letter-spacing: .01em;
      user-select: none;
    }

    .es-left, .es-right { display: flex; align-items: center; gap: 12px; min-width: 0; }

    .es-item { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    .es-item svg { width: 11px; height: 11px; opacity: .75; }
    .es-item.accent { color: var(--accent); opacity: .9; }
    .es-item.dim { opacity: .65; }

    .usage-meter { display: inline-flex; align-items: center; gap: 4px; }
    .usage-item { display: inline-flex; align-items: center; gap: 3px; }
    .usage-k { opacity: .7; }
    .usage-v { color: var(--text); }

    .usage-sep { width: 1px; height: 9px; background: var(--border-strong); margin: 0 3px; }

    /* ═══ 斜杠菜单 ═══ */
    #slash-menu {
      display: none;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(100% - 4px);
      width: 100%;
      max-width: calc(var(--content-w) - 56px);
      max-height: 260px;
      overflow-y: auto;
      padding: 4px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow-2);
      z-index: 20;
    }

    #slash-menu.show { display: block; }

    .slash-item {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 5px 8px;
      border-radius: 5px;
      cursor: pointer;
    }

    .slash-item:hover, .slash-item.active { background: var(--panel-2); }

    .cmd-name {
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--accent);
      flex: none;
    }

    .cmd-desc {
      font-size: 11px;
      color: var(--dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ═══ 历史覆盖层 ═══ */
    #history-panel {
      display: none;
      position: absolute;
      inset: 44px 0 0 0;
      z-index: 15;
      flex-direction: column;
      background: var(--bg);
    }

    #history-panel.show { display: flex; }

    #history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 38px;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      flex: none;
    }

    #history-header .title {
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--dim);
    }

    #history-close {
      padding: 3px 9px;
      border-radius: 5px;
      border: 1px solid var(--border);
      color: var(--dim);
      font-size: 11px;
    }

    #history-close:hover { color: var(--bright); border-color: var(--border-strong); }

    #history-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 0;
    }

    /* ═══ 设置面板 ═══ */
    #settings-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 60;
      align-items: center;
      justify-content: center;
      background: rgba(4, 7, 11, .62);
      backdrop-filter: blur(3px);
    }

    #settings-modal.show { display: flex; }

    .settings-card {
      width: 440px;
      max-width: calc(100vw - 32px);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      background: var(--panel);
      box-shadow: var(--shadow-3);
      overflow: hidden;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(6px) scale(.99); }
      to { opacity: 1; transform: none; }
    }

    .settings-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }

    .settings-head h3 {
      margin: 0;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--bright);
      letter-spacing: .01em;
    }

    .settings-close {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border-radius: 4px;
      color: var(--dim);
    }

    .settings-close:hover { background: var(--panel-2); color: var(--bright); }

    .settings-body { padding: 4px 0 10px; }

    .settings-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 7px 14px;
    }

    .settings-label {
      width: 74px;
      flex: none;
      color: var(--dim);
      font-size: 11.5px;
    }

    .settings-value {
      flex: 1;
      min-width: 0;
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--text);
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .settings-input {
      flex: 1;
      min-width: 0;
      height: 26px;
      padding: 0 8px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--code);
      color: var(--text);
      font-family: var(--mono);
      font-size: 11.5px;
      outline: none;
      text-align: right;
    }

    .settings-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }

    .settings-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 14px 2px;
      border-top: 1px solid var(--border);
      margin-top: 6px;
    }

    .settings-actions button {
      height: 26px;
      padding: 0 10px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-size: 11.5px;
      transition: all .12s;
    }

    .settings-actions button:hover { border-color: var(--border-strong); color: var(--bright); }


    /* ── 编辑器风格补充 ── */
    .tool-slot {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      overflow: hidden;
      flex: 1 1 auto;
    }

    .status { display: inline-flex; align-items: center; gap: 5px; }

    .status.loading::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 1.1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: .25; }
      50% { opacity: 1; }
    }

    #editor-status .conn-status {
      border: 0;
      height: auto;
      padding: 0;
      gap: 5px;
      font-size: 10px;
    }

    #editor-status .dot { width: 5px; height: 5px; }
    @media (max-width: 860px) {
      .sidebar { width: 208px; min-width: 208px; }
      .composer-hint { display: none; }
      .msg, .msg-assistant { padding-left: 20px; padding-right: 20px; }
      .tool-block, .thinking-block, .perm-dialog, .msg-system.multi, .msg-error { max-width: calc(100% - 40px); }
    }
  
    /* 尊重系统减少动效偏好：截图与无障碍场景下不应残留过渡中间态 */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
  
    /* 授权弹窗里的 diff 行 */
    .perm-dialog .desc .pl { display: block; }
    .perm-dialog .desc .pl.add { background: var(--green-dim); color: var(--bright); }
    .perm-dialog .desc .pl.del { background: var(--red-dim); color: var(--bright); }
    .perm-dialog .desc .pl.meta { color: var(--dim); }</style>
</head>
<body>
<div id="app">

  <!-- ═══ 左栏：会话 ═══ -->
  <div class="sidebar" id="left-sidebar">
    <div class="sidebar-header">
      <span class="brand">
        <span class="brand-badge">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 2.6 20.6 7.4v9.2L12 21.4 3.4 16.6V7.4z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <circle cx="12" cy="12" r="2.4" fill="currentColor"/>
          </svg>
        </span>
        <span class="brand-name">MewAgent</span>
      </span>
      <button class="new-session-btn" onclick="newSession()" title="新建会话">
        <span class="plus">+</span><span>新建</span>
      </button>
    </div>
    <div class="workspace" title="当前工作目录">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.6l1.8 2h7.6a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span class="ws-name" id="ws-name">workspace</span>
      <span class="ws-branch">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" style="width:11px;height:11px"><circle cx="7" cy="6" r="2.2" stroke="currentColor" stroke-width="1.6"/><circle cx="7" cy="18" r="2.2" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="9" r="2.2" stroke="currentColor" stroke-width="1.6"/><path d="M7 8.2v7.6M17 11.2c0 2.2-2.4 2.6-4.6 3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        main
      </span>
    </div>
    <div class="session-search">
      <span class="search-icon">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.2" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </span>
      <input id="session-search" type="search" placeholder="搜索会话…" aria-label="搜索会话" autocomplete="off">
    </div>
    <div class="session-count" id="session-count"></div>
    <div id="session-list" role="list" aria-label="会话列表">
      <div class="skeleton" aria-hidden="true">
        <div class="line"></div><div class="line short"></div>
      </div>
      <div class="skeleton" aria-hidden="true">
        <div class="line"></div><div class="line short"></div>
      </div>
      <div class="skeleton" aria-hidden="true">
        <div class="line"></div><div class="line short"></div>
      </div>
    </div>
  </div>

  <!-- ═══ 中间：对话 ═══ -->
  <div id="center" style="position:relative;">

<!-- ═══ 设置面板 ═══ -->
<div id="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">

      <h3 id="settings-title">设置</h3>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
// ─── DOM refs ───
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const connStatus = document.getElementById('conn-status');
const slashMenu = document.getElementById('slash-menu');
const sessionList = document.getElementById('session-list');
const sessionCount = document.getElementById('session-count');
const sessionLabel = document.getElementById('session-label');
const historyPanel = document.getElementById('history-panel');
const historyBody = document.getElementById('history-body');
const historyTitle = document.getElementById('history-title');
const searchInput = document.getElementById('session-search');
const settingsModal = document.getElementById('settings-modal');
const settingsBody = document.getElementById('settings-body');
const fileInput = document.getElementById('file-input');
const attachmentBar = document.getElementById('attachment-bar');
const centerEl = document.getElementById('center');

// ─── State ───
let ws = null, streaming = false, allCommands = [], slashCursor = 0, slashFiltered = [];
let currentAssistantEl = null, currentStreamText = '', currentThinkingEl = null, currentThinkingText = '';
let autoScroll = true, pingTimer = null, connectedOnce = false;
let allSessions = [], currentSessionId = null;
let sessionQuery = '', sessionLoading = true, lastPrompt = '';
let currentCwd = '';
let attachments = [];

// ─── Theme ───
function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('mewagent-theme', theme);
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.themeVal === theme));
}
(function(){const s=localStorage.getItem('mewagent-theme')||(window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');setTheme(s)})();

// ─── Markdown ───
if(typeof marked!=='undefined')marked.setOptions({breaks:true,gfm:true});
function renderMarkdown(t){if(typeof marked!=='undefined')try{return marked.parse(t)}catch(e){}return escapeHtml(t)}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// ─── 展示格式化 ───
function fmtTokens(n){
  n=Number(n)||0;
  if(n>=1000000)return (n/1000000).toFixed(n>=10000000?0:1)+'M';
  if(n>=1000)return (n/1000).toFixed(n>=10000?0:1)+'k';
  return String(n);
}
function updateUsage(inTok,outTok){
  const a=document.getElementById('usage-in'),b=document.getElementById('usage-out');
  const m=document.getElementById('usage-meter');
  if(a)a.textContent=fmtTokens(inTok);
  if(b)b.textContent=fmtTokens(outTok);
  if(m)m.style.display='inline-flex';
}
function resetUsage(){
  const m=document.getElementById('usage-meter');
  const a=document.getElementById('usage-in'),b=document.getElementById('usage-out');
  if(a)a.textContent='0';
  if(b)b.textContent='0';
  if(m)m.style.display='inline-flex';
}
// 后端 formatRelativeTime 返回英文，这里只做展示层转换，不改服务端
function relTime(s){
  if(!s)return '';
  return String(s)
    .replace(/^just now$/,'刚刚')
    .replace(/(\d+) minute(s?) ago/,'$1 分钟前')
    .replace(/(\d+) hour(s?) ago/,'$1 小时前')
    .replace(/(\d+) day(s?) ago/,'$1 天前')
    .replace(/(\d+) week(s?) ago/,'$1 周前')
    .replace(/(\d+) month(s?) ago/,'$1 个月前');
}
function sessionTitle(s){
  const raw=String((s&&(s.title||s.firstMessage||s.id))||'').replace(/\s+/g,' ').trim();
  return raw.length>36?raw.slice(0,36)+'…':raw;
}

// ─── WebSocket ───
const TOKEN_KEY='mewagent-token';
// 令牌来源：URL ?token= 优先（方便一次性链接），否则用 localStorage 里存的
function authToken(){
  const fromUrl=new URLSearchParams(location.search).get('token');
  if(fromUrl){
    try{localStorage.setItem(TOKEN_KEY,fromUrl)}catch(e){}
    return fromUrl;
  }
  try{return localStorage.getItem(TOKEN_KEY)||''}catch(e){return ''}
}
function connect(){
  if(pingTimer){clearInterval(pingTimer);pingTimer=null}
  if(ws){try{ws.onclose=null;ws.close()}catch(e){}ws=null}
  const proto=location.protocol==='https:'?'wss:':'ws:';
  const token=authToken();
  ws=new WebSocket(proto+'//'+location.host+'/ws'+(token?'?token='+encodeURIComponent(token):''));
  ws.onopen=()=>{
    connStatus.innerHTML='<span class="dot connected"></span>已连接';
    connStatus.classList.remove('can-retry');
    connStatus.onclick=null;
    connStatus.title='';
    pingTimer=setInterval(()=>{if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'ping',data:{}}))},10000);
    ws.send(JSON.stringify({type:'list_sessions',data:{}}));
  };
  ws.onclose=(evt)=>{
    if(pingTimer){clearInterval(pingTimer);pingTimer=null}
    // 1008 = 服务端拒绝（令牌缺失或不匹配），不自动重连，改为让用户输入
    if(evt&&evt.code===1008){
      connStatus.innerHTML='<span class="dot disconnected"></span>需要访问令牌';
      connStatus.classList.add('can-retry');
      connStatus.title='点击输入令牌';
      connStatus.onclick=()=>{
        const t=window.prompt('请输入访问令牌（服务端 MEWAGENT_TASK_TOKEN）');
        if(t&&t.trim()){
          try{localStorage.setItem(TOKEN_KEY,t.trim())}catch(e){}
          connect();
        }
      };
      return;
    }
    connStatus.innerHTML='<span class="dot disconnected"></span>重连中…';
    // 自动重连之外，再给一个手动入口：等太久或网络恢复时不用干等
    connStatus.classList.add('can-retry');
    connStatus.title='点击立即重连';
    connStatus.onclick=()=>connect();
    setTimeout(connect,3000);
  };
  ws.onerror=()=>{};
  ws.onmessage=(evt)=>{const msg=JSON.parse(evt.data);handleMessage(msg)};
}

// ─── Message handler ───
function handleMessage(msg){
  switch(msg.type){
    case 'connected': {
      const isNewSession=msg.data.session!==currentSessionId;
      currentSessionId=msg.data.session;
      sessionLabel.textContent='会话 · '+formatSessionLabel(msg.data.session);
      sessionLabel.title=msg.data.session+'  ·  '+msg.data.cwd;
      currentCwd=msg.data.cwd||'';
      const wsName=(currentCwd.split(/[\\/]/).filter(Boolean).pop())||'workspace';
      const wsEl=document.getElementById('ws-name');
      if(wsEl){wsEl.textContent=wsName;const box=wsEl.closest('.workspace');if(box)box.title=currentCwd;}
      const esWs=document.getElementById('es-workspace');
      if(esWs){esWs.textContent=wsName;esWs.title=currentCwd;}
      if(isNewSession)resetUsage();
      if(!connectedOnce){showWelcome();connectedOnce=true}
      break;
    }
    case 'sessions':
      allSessions=msg.data||[];
      sessionLoading=false;
      renderSessions();
      break;
    case 'commands':
      allCommands=msg.data||[];
      renderCommands();
      break;
    case 'system': addSystem(msg.data.message); break;
    case 'clear': messagesEl.innerHTML=''; addSystem('对话已清空'); break;
    case 'command_done': streaming=false; updateUI(); break;
    case 'replay_user': addUser(msg.data.content); break;
    case 'replay_assistant':{const el=addAssistant('');updateAssistant(el,msg.data.content,false);break;}
    case 'stream_text':
      if(currentThinkingEl){currentThinkingEl.querySelector('.thinking-header span:last-child').textContent='💭 思考';currentThinkingEl=null;currentThinkingText=''}
      if(!currentAssistantEl){currentAssistantEl=addAssistant('');currentStreamText=''}
      currentStreamText+=msg.data.text;
      updateAssistant(currentAssistantEl,currentStreamText,true);
      break;
    case 'stream_end':
      if(currentAssistantEl){updateAssistant(currentAssistantEl,currentStreamText,false)}
      currentAssistantEl=null;currentStreamText='';
      break;
    case 'thinking_text':
      if(!currentThinkingEl){currentThinkingEl=addThinking();currentThinkingText=''}
      currentThinkingText+=msg.data.text;
      currentThinkingEl.querySelector('.thinking-body').textContent=currentThinkingText;
      break;
    case 'tool_use':
      if(currentThinkingEl){currentThinkingEl.querySelector('.thinking-header span:last-child').textContent='💭 思考';currentThinkingEl=null;currentThinkingText=''}
      addToolUse(msg.data);
      break;
    case 'tool_result': updateToolResult(msg.data); break;
    case 'permission_request': addPermissionDialog(msg.data); break;
    case 'ask_user': addAskUserDialog(msg.data); break;
    case 'loop_complete':
      if(currentAssistantEl){updateAssistant(currentAssistantEl,currentStreamText,false);currentAssistantEl=null;currentStreamText=''}
      currentThinkingEl=null;currentThinkingText='';
      const el=document.createElement('div');el.className='done-indicator';el.textContent='✻ 完成 · '+msg.data.elapsed.toFixed(1)+'s';
      messagesEl.appendChild(el);streaming=false;updateUI();scrollToBottom();
      if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'list_sessions',data:{}}));
      break;
    case 'usage': updateUsage(msg.data.inputTokens,msg.data.outputTokens); break;
    case 'error': addError(msg.data.message);streaming=false;updateUI();break;
    case 'compact': addSystem('⟳ '+msg.data.message);break;
    case 'retry': addSystem('↻ 重试中：'+msg.data.reason);break;
    case 'session_history':
      showSessionHistory(msg.data);
      break;
    case 'session_deleted':
      if(msg.data&&msg.data.id===currentSessionId){currentSessionId=null;closeHistory()}
      break;
  }
}

// ─── Session List ───
function skeletonMarkup(n){
  let html='';
  for(let i=0;i<n;i++){
    html+='<div class="skeleton" aria-hidden="true"><div class="line"></div><div class="line short"></div></div>';
  }
  return html;
}

// 按服务端返回的英文相对时间分桶（在 relTime 转换之前用原始值判断）
function sessionBucket(relativeTime){
  const t=String(relativeTime||'');
  if(t.includes('just now')||t.includes('minute')||t.includes('hour'))return '今天';
  if(t.includes('1 day'))return '昨天';
  if(t.includes('day'))return '最近一周';
  return '更早';
}

function renderSessions(){
  const query=sessionQuery.trim().toLowerCase();
  const total=allSessions.length;
  const list=query
    ? allSessions.filter(s=>((s.title||'')+' '+(s.firstMessage||'')+' '+s.id).toLowerCase().includes(query))
    : allSessions;

  sessionCount.textContent=query
    ? '匹配 '+list.length+' / '+total+' 个会话'
    : total+' 个会话';

  if(sessionLoading){
    sessionList.innerHTML=skeletonMarkup(3);
    return;
  }
  if(total===0){
    sessionList.innerHTML='<div class="session-empty">还没有会话<br>在右侧描述一个任务即可开始</div>';
    return;
  }
  if(list.length===0){
    sessionList.innerHTML='<div class="session-empty">没有匹配「'+escapeHtml(sessionQuery)+'」的会话</div>';
    return;
  }

  let html='';
  let bucket='';
  list.forEach(s=>{
    const b=sessionBucket(s.relativeTime);
    if(b!==bucket){
      bucket=b;
      html+='<div class="session-group">'+b+'</div>';
    }
    const active=s.id===currentSessionId?'active':'';
    const title=sessionTitle(s);
    const parts=[];
    if(s.relativeTime)parts.push(relTime(s.relativeTime));
    if(s.messageCount)parts.push(s.messageCount+' 条消息');
    const meta=parts.join(' · ');
    html+='<div class="session-item '+active+'" role="listitem" tabindex="0" title="'+escapeHtml(s.id)+'"'
      +' onclick="viewSession(\''+s.id+'\')" onkeydown="if(event.key===\'Enter\')viewSession(\''+s.id+'\')">'
      +'<div class="session-main">'
        +'<div class="session-title">'+escapeHtml(title)+'</div>'
        +'<div class="session-meta">'+escapeHtml(meta)+'</div>'
      +'</div>'
      +'<button class="session-rename" title="重命名会话" aria-label="重命名会话"'
        +' onclick="event.stopPropagation();startInlineRename(\''+s.id+'\',this)">✎</button>'
      +'<button class="session-del" title="删除会话" aria-label="删除会话" onclick="event.stopPropagation();askDelete(\''+s.id+'\',this)">×</button>'
      +'</div>';
  });
  sessionList.innerHTML=html;
}

// 删除会话：第一次点击进入待确认态，3 秒内再点一次才真正删除
function askDelete(id,btn){
  if(btn.dataset.armed==='1'){
    btn.dataset.armed='';btn.classList.remove('armed');
    btn.textContent='×';btn.title='删除会话';
    if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'delete_session',data:{id}}));
    return;
  }
  btn.dataset.armed='1';btn.classList.add('armed');
  btn.textContent='✓';btn.title='再次点击确认删除';
  setTimeout(()=>{
    if(btn.isConnected&&btn.dataset.armed==='1'){
      btn.dataset.armed='';btn.classList.remove('armed');
      btn.textContent='×';btn.title='删除会话';
    }
  },3000);
}

function viewSession(id){
  if(ws&&ws.readyState===WebSocket.OPEN){
    ws.send(JSON.stringify({type:'get_session_history',data:{id}}));
  }
}

// 侧栏内联重命名：点铅笔把标题换成输入框，Enter 保存，Esc / 失焦取消
function startInlineRename(id,btn){
  const item=btn.closest('.session-item');
  if(!item||item.querySelector('.session-title-input'))return;
  const titleEl=item.querySelector('.session-title');
  if(!titleEl)return;
  const current=allSessions.find(s=>s.id===id)||{};
  const original=current.title||'';
  const input=document.createElement('input');
  input.className='session-title-input';
  input.value=original;
  input.placeholder=sessionTitle(current);
  input.maxLength=60;
  input.setAttribute('aria-label','重命名会话');
  titleEl.replaceWith(input);
  input.focus();
  input.select();
  let finished=false;
  const finish=(save)=>{
    if(finished)return;
    finished=true;
    const title=input.value.trim();
    if(save&&title&&title!==original&&ws&&ws.readyState===WebSocket.OPEN){
      ws.send(JSON.stringify({type:'rename_session',data:{id,title}}));
    }
    renderSessions();
  };
  input.addEventListener('keydown',e=>{
    e.stopPropagation();
    if(e.key==='Enter'){e.preventDefault();finish(true);}
    else if(e.key==='Escape'){e.preventDefault();finish(false);}
  });
  input.addEventListener('blur',()=>finish(false));
  ['click','dblclick'].forEach(t=>input.addEventListener(t,e=>e.stopPropagation()));
}

function closeHistory(){
  historyPanel.classList.remove('show');
}

function showSessionHistory(data){
  const msgs=data.messages||[];
  historyTitle.textContent='会话 · '+formatSessionLabel(data.id);
  historyTitle.title=data.id;
  historyBody.innerHTML='';
  if(msgs.length===0){
    historyBody.innerHTML='<div class="session-empty">该会话还没有消息</div>';
  }else{
    msgs.forEach(m=>{
      const div=document.createElement('div');
      const bubble=document.createElement('div');
      if(m.role==='user'){
        div.className='msg msg-user';
        bubble.className='bubble';
        bubble.textContent=m.content;
      }else{
        div.className='msg msg-assistant';
        bubble.className='bubble';
        bubble.innerHTML=renderMarkdown(m.content);
      }
      div.appendChild(bubble);
      historyBody.appendChild(div);
    });
  }
  historyPanel.classList.add('show');
}

// ─── Commands ───
// 命令列表现在只用于输入框内的斜杠菜单，不再渲染到侧栏
function renderCommands(){}

// ─── Message renderers ───
function addUser(text){
  clearWelcome();
  const div=document.createElement('div');div.className='msg msg-user';
  div.innerHTML='<div class="bubble">'+escapeHtml(text)+'</div>';
  messagesEl.appendChild(div);scrollToBottom();
}
function addAssistant(text){
  const div=document.createElement('div');div.className='msg msg-assistant';
  div.innerHTML='<div class="bubble"></div>';
  messagesEl.appendChild(div);scrollToBottom();

const toolElements={};
const TOOL_ICONS={
  read:'<svg viewBox="0 0 24 24" fill="none"><path d="M6 3.5h7.5L19 9v11.5H6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M13 3.6V9h5.4" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
  write:'<svg viewBox="0 0 24 24" fill="none"><path d="M6 3.5h7.5L19 9v11.5H6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 13.5h6M9 16.5h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  bash:'<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4.5" width="18" height="15" rx="2.2" stroke="currentColor" stroke-width="1.6"/><path d="m7.5 10 2.6 2.4-2.6 2.4M12.6 15h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.2" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
  default:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.6"/><path d="M12 3.2v2.4M12 18.4v2.4M20.8 12h-2.4M5.6 12H3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'
};
function toolKind(name){
  const n=String(name||'').toLowerCase();
  if(n.includes('read'))return 'read';
  if(n.includes('write')||n.includes('edit')||n.includes('patch'))return 'write';
  if(n.includes('bash')||n.includes('shell')||n.includes('exec')||n.includes('terminal'))return 'bash';
  if(n.includes('glob')||n.includes('grep')||n.includes('search')||n.includes('find')||n.includes('list'))return 'search';
  return 'default';
}
function toolKeyOf(data){return data.toolName+'_'+(data.toolId||'')}
// 标题栏里那个「目标」：文件路径显示成文件名 pill，命令/模式显示成单行预览
function toolTargetMarkup(data){
  const a=(data&&data.args)||{};
  const p=a.file_path||a.path;
  if(p){
    const base=String(p).split(/[\\/]/).pop();
    return '<span class="tool-file" title="'+escapeHtml(String(p))+'"><span class="file-dot"></span><span class="file-path">'+escapeHtml(base)+'</span></span>';
  }
  const q=a.pattern||a.query||a.command;
  if(q)return '<span class="tool-args-preview">'+escapeHtml(String(q).replace(/\s+/g,' ').slice(0,96))+'</span>';
  return '';
}
// 只对真正的 diff 行计数，没有 diff 就不显示统计，避免编数字
function diffStat(text){
  if(!text)return '';
  let add=0,del=0;
  for(const line of String(text).split('\n')){
    if(line.startsWith('+++')||line.startsWith('---'))continue;
    if(line.startsWith('+'))add++;
    else if(line.startsWith('-'))del++;
  }
  if(!add&&!del)return '';
  return '<span class="tool-diff">'+(add?'<span class="add">+'+add+'</span>':'')+(del?'<span class="del">−'+del+'</span>':'')+'</span>';
}
const MAX_OUTPUT_LINES=400;
// diff 着色只在写文件类工具里生效：读文件的内容本身可能以 +/- 开头，不能瞎染色
function renderCodeOutput(text,asDiff){
  const lines=String(text||'').split('\n');
  const out=lines.slice(0,MAX_OUTPUT_LINES).map(line=>{
    let cls='code-line';
    if(/^\+\+\+|^---/.test(line))cls+=' meta';
    else if(asDiff&&line.startsWith('+'))cls+=' add';
    else if(asDiff&&line.startsWith('-'))cls+=' del';
    return '<span class="'+cls+'">'+(escapeHtml(line)||' ')+'</span>';
  });
  if(lines.length>MAX_OUTPUT_LINES)out.push('<span class="code-line meta">…（已截断，共 '+lines.length+' 行）</span>');
  return out.join('');
}
// 标题 pill 已经展示了目标（文件路径 / 命令），再展开一份 JSON 是纯噪音。
// 只有检索类工具（Grep/Glob/Task 等）用这个块补充展示 pattern 之类的小参数。
function argsForDisplay(toolName,args){
  if(!args)return '';
  const keys=Object.keys(args);
  if(!keys.length)return '';
  const kind=toolKind(toolName);
  if(kind==='read'||kind==='write'||kind==='bash')return '';
  if(keys.every(k=>k==='file_path'||k==='path'))return '';
  const text=JSON.stringify(args,null,2);
  if(text.length>600)return text.slice(0,600)+'…';
  return text;
}
function addToolUse(data){
  const key=toolKeyOf(data);
  const argsStr=argsForDisplay(data.toolName,data.args);
  const existing=toolElements[key];

  // 同一个 tool call 会到达两个事件：ToolCallStart（无参数）与 ToolCallComplete（带参数）。
  // 第二次只补全参数，不重复建卡片，否则第一张会永远停在"运行中"。
  if(existing){
    const slot=existing.querySelector('.tool-slot');
    if(slot&&!slot.childElementCount)slot.innerHTML=toolTargetMarkup(data);
    const argsBox=existing.querySelector('.tool-args');
    if(argsBox&&argsStr&&!argsBox.textContent){argsBox.textContent=argsStr;argsBox.style.display='block'}
    scrollToBottom();
    return;
  }

  const kind=toolKind(data.toolName);
  const div=document.createElement('div');div.className='tool-block';
  div.innerHTML='<div class="tool-header" onclick="toggleTool(this)">'
    +'<span class="icon">▶</span>'
    +'<span class="tool-icon" data-kind="'+kind+'">'+(TOOL_ICONS[kind]||TOOL_ICONS.default)+'</span>'
    +'<span class="name">'+escapeHtml(data.toolName)+'</span>'
    +'<span class="tool-slot">'+toolTargetMarkup(data)+'</span>'
    +'<span class="status loading">运行中</span>'
    +'</div>'
    +'<div class="tool-body">'
    +'<div class="tool-args"'+(argsStr?'':' style="display:none"')+'>'+(argsStr?escapeHtml(argsStr):'')+'</div>'
    +'<div class="tool-output"></div>'
    +'</div>';
  messagesEl.appendChild(div);
  toolElements[key]=div;
  scrollToBottom();
}
function applyToolStatus(div,data){
  const statusEl=div.querySelector('.status');
  if(!statusEl)return;
  if(data.isError){statusEl.className='status err';statusEl.textContent='✗ '+data.elapsed.toFixed(1)+'s'}
  else{statusEl.className='status ok';statusEl.textContent='✓ '+data.elapsed.toFixed(1)+'s'}
  const header=div.querySelector('.tool-header');
  const stats=toolKind(data.toolName)==='write'?diffStat(data.output):'';
  if(stats&&header&&!header.querySelector('.tool-diff')){
    statusEl.insertAdjacentHTML('beforebegin',stats);
  }
}
function fillToolOutput(div,data){
  const outputEl=div.querySelector('.tool-output');
  if(outputEl&&data.output)outputEl.innerHTML=renderCodeOutput(data.output,toolKind(data.toolName)==='write');
  // 出错的输出默认展开；写文件的 diff 也默认展开——这通常正是用户要看的
  const autoShow=data.isError||toolKind(data.toolName)==='write';
  if(autoShow){
    const body=div.querySelector('.tool-body');
    const icon=div.querySelector('.icon');
    if(body)body.classList.add('show');
    if(icon)icon.classList.add('expanded');
  }
}
function updateToolResult(data){
  const key=data.toolName+'_'+(data.toolId||''),div=toolElements[key];
  if(div){
    applyToolStatus(div,data);
    fillToolOutput(div,data);
    delete toolElements[key];
  }else{
    const kind=toolKind(data.toolName);
    const block=document.createElement('div');block.className='tool-block';
    const status=data.isError?'✗':'✓',statusClass=data.isError?'err':'ok';
    block.innerHTML='<div class="tool-header" onclick="toggleTool(this)">'
      +'<span class="icon">▶</span>'
      +'<span class="tool-icon" data-kind="'+kind+'">'+(TOOL_ICONS[kind]||TOOL_ICONS.default)+'</span>'
      +'<span class="name">'+escapeHtml(data.toolName)+'</span>'
      +'<span class="tool-slot">'+toolTargetMarkup(data)+'</span>'
      +'<span class="status '+statusClass+'">'+status+' '+data.elapsed.toFixed(1)+'s</span>'
      +'</div>'
      +'<div class="tool-body"><div class="tool-output">'+renderCodeOutput(data.output||'',kind==='write')+'</div></div>';
    messagesEl.appendChild(block);
  }
  scrollToBottom();
}
function toggleTool(header){header.querySelector('.icon').classList.toggle('expanded');header.nextElementSibling.classList.toggle('show')}

const MAX_MESSAGE_NODES=400;

// ─── 附件上传 ───
function fmtSize(n){
  n=Number(n)||0;
  if(n<1024)return n+'B';
  if(n<1024*1024)return (n/1024).toFixed(1)+'KB';
  return (n/1024/1024).toFixed(1)+'MB';
}
function pickFile(){ if(streaming)return; fileInput.click(); }
async function uploadFile(file){
  if(file.size>20*1024*1024){ addError('文件超过 20MB：'+file.name); return; }
  const fd=new FormData();
  fd.append('file',file,file.name);
  try{
    const res=await fetch('/upload',{method:'POST',body:fd});
    if(!res.ok){
      const err=await res.json().catch(()=>({}));
      addError('上传失败：'+(err.error||('HTTP '+res.status)));
      return;
    }
    const data=await res.json();
    attachments.push(data);
    renderAttachments();
  }catch(e){
    addError('上传失败：'+e.message);
  }
}
function renderAttachments(){
  if(!attachmentBar)return;
  if(!attachments.length){
    attachmentBar.classList.remove('show');
    attachmentBar.innerHTML='';
    return;
  }
  attachmentBar.classList.add('show');
  attachmentBar.innerHTML=attachments.map((a,i)=>
    '<span class="attachment-chip" title="'+escapeHtml(a.path)+'">'
    +'<span class="att-name">'+escapeHtml(a.name)+'</span>'
    +'<span class="att-size">'+fmtSize(a.size)+'</span>'
    +'<button class="att-remove" aria-label="移除附件" onclick="removeAttachment('+i+')">×</button>'
    +'</span>').join('');
}
function removeAttachment(i){ attachments.splice(i,1); renderAttachments(); }

fileInput.addEventListener('change',async ()=>{
  const files=[...fileInput.files];
  fileInput.value='';

// 拖拽上传：拖到对话区松开即可
let dragDepth=0;
centerEl.addEventListener('dragenter',e=>{
  if(!e.dataTransfer||!e.dataTransfer.types.includes('Files'))return;
  e.preventDefault();dragDepth++;centerEl.classList.add('drag-over');
});
centerEl.addEventListener('dragover',e=>{
  if(e.dataTransfer&&e.dataTransfer.types.includes('Files'))e.preventDefault();
});
centerEl.addEventListener('dragleave',()=>{
  dragDepth=Math.max(0,dragDepth-1);
  if(dragDepth===0)centerEl.classList.remove('drag-over');
});
centerEl.addEventListener('drop',e=>{
  if(!e.dataTransfer||!e.dataTransfer.files.length)return;
  e.preventDefault();
  dragDepth=0;centerEl.classList.remove('drag-over');
  [...e.dataTransfer.files].forEach(uploadFile);
});

// ─── Input ───
function runCommand(text){
  if(streaming)return;
  const files=attachments.slice();
  if(!text&&!files.length)return;
  let payload=text;
  // 附件只跟随普通消息；斜杠命令不携带附件
  if(files.length&&!text.startsWith('/')){
    payload='（附件：'+files.map(a=>a.path).join(', ')+'）\n'+text;
    attachments=[];renderAttachments();
  }
  // 只记住普通消息，斜杠命令不参与「重试上一条」
  if(!payload.startsWith('/'))lastPrompt=payload;
  addUser(payload);
  ws.send(JSON.stringify({type:'user_message',data:{content:payload}}));
  inputEl.value='';inputEl.style.height='auto';streaming=true;updateUI();
}
function sendMessage(){if(slashMenu.classList.contains('show'))hideSlashMenu();runCommand(inputEl.value.trim())}
function updateUI(){sendBtn.disabled=streaming;inputEl.disabled=streaming;if(!streaming)inputEl.focus()}

// ─── Slash menu ───
function openCmdMenu(){
  if(!allCommands.length)return;
  if(!inputEl.value.startsWith('/'))inputEl.value='/';
  inputEl.focus();
  inputEl.dispatchEvent(new Event('input'));
}
function showSlashMenu(f){const p=f.toLowerCase();slashFiltered=allCommands.filter(c=>c.name.startsWith(p));if(!slashFiltered.length){hideSlashMenu();return}slashCursor=0;renderSlashMenu();slashMenu.classList.add('show')}
function hideSlashMenu(){slashMenu.classList.remove('show');slashFiltered=[];slashCursor=0}
function renderSlashMenu(){slashMenu.innerHTML=slashFiltered.map((c,i)=>'<div class="slash-item'+(i===slashCursor?' active':'')+'" data-idx="'+i+'"><span class="cmd-name">/'+escapeHtml(c.name)+'</span><span class="cmd-desc">'+escapeHtml(c.description)+'</span></div>').join('');slashMenu.querySelectorAll('.slash-item').forEach(el=>{el.addEventListener('mousedown',(e)=>{e.preventDefault();selectSlashItem(parseInt(el.dataset.idx))})});const ae=slashMenu.querySelector('.active');if(ae)ae.scrollIntoView({block:'nearest'})}
// 这些命令不需要参数，选中后直接执行；其余命令填入输入框等待补参数
// 不需要参数、选中即执行；clear 有破坏性，故意留在外面要求再确认一次
const NO_ARG_CMDS=new Set(['compact','status','help','mcp','review','plan']);
function selectSlashItem(i){
  const c=slashFiltered[i];if(!c)return;
  hideSlashMenu();
  if(NO_ARG_CMDS.has(c.name)){
    inputEl.value='';
    runCommand('/'+c.name);
  }else{
    inputEl.value='/'+c.name+' ';
    inputEl.focus();
  }
}
inputEl.addEventListener('keydown',(e)=>{if(slashMenu.classList.contains('show')){if(e.key==='ArrowDown'){e.preventDefault();slashCursor=Math.min(slashCursor+1,slashFiltered.length-1);renderSlashMenu();return}if(e.key==='ArrowUp'){e.preventDefault();slashCursor=Math.max(slashCursor-1,0);renderSlashMenu();return}if(e.key==='Tab'||e.key==='Enter'&&!e.shiftKey){e.preventDefault();selectSlashItem(slashCursor);return}if(e.key==='Escape'){e.preventDefault();hideSlashMenu();return}}if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}})
inputEl.addEventListener('input',()=>{inputEl.style.height='auto';inputEl.style.height=Math.min(inputEl.scrollHeight,200)+'px';const v=inputEl.value;if(v.startsWith('/')&&!v.includes('\n')){const p=v.substring(1).split(' ')[0];if(!v.includes(' '))showSlashMenu(p);else hideSlashMenu()}else hideSlashMenu()})
sendBtn.addEventListener('click',sendMessage);

// ─── New session ───
function newSession(){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'new_session'}))}

// ─── 设置面板 ───
function openSettings(){renderSettings();settingsModal.classList.add('show');}
function closeSettings(){settingsModal.classList.remove('show');}
function renderSettings(){
  if(!settingsBody)return;
  const theme=document.documentElement.getAttribute('data-theme')||'dark';
  const current=allSessions.find(s=>s.id===currentSessionId);
  const currentName=(current&&current.title)||'';
  const fallback=current?sessionTitle(current):'';
  const rows=[
    ['会话', currentSessionId||'—'],
    ['工作目录', currentCwd||'—'],
    ['主题', theme==='light'?'浅色':'深色'],
    ['累计 token', document.getElementById('usage-in').textContent+' / '+document.getElementById('usage-out').textContent]
  ];
  let html='';
  html+='<div class="settings-row"><span class="settings-label">会话名称</span>'
    +'<input id="rename-input" class="settings-input" maxlength="60" autocomplete="off"'
    +' value="'+escapeHtml(currentName)+'" placeholder="'+escapeHtml(fallback)+'"'
    +' aria-label="会话名称"'
    +' onkeydown="if(event.key===\'Enter\'){event.preventDefault();renameSession();}">'
    +'</div>';
  rows.forEach(([k,v])=>{
    html+='<div class="settings-row"><span class="settings-label">'+k+'</span>'
      +'<span class="settings-value" title="'+escapeHtml(String(v))+'">'+escapeHtml(String(v))+'</span></div>';
  });
  html+='<div class="settings-actions">'
    +'<button onclick="renameSession()">保存名称</button>'
    +'<button onclick="runSettingsCmd(\'/compact\')">压缩上下文</button>'
    +'<button onclick="runSettingsCmd(\'/status\')">查看状态</button>'
    +'<button onclick="runSettingsCmd(\'/retitle\')">回填会话标题</button>'
    +'<button onclick="toggleTheme()">切换主题</button>'
    +'</div>'
    +'<div class="settings-actions">'
    +'<button onclick="copySessionId()">复制会话 ID</button>'
    +'<button onclick="closeSettings()">关闭</button>'
    +'</div>';
  settingsBody.innerHTML=html;
}
function renameSession(){
  const input=document.getElementById('rename-input');
  if(!input||!currentSessionId)return;
  const title=input.value.trim();
  if(!title)return;
  if(ws&&ws.readyState===WebSocket.OPEN){
    ws.send(JSON.stringify({type:'rename_session',data:{id:currentSessionId,title}}));
  }
  closeSettings();
}
function runSettingsCmd(cmd){closeSettings();runCommand(cmd);}
function toggleTheme(){
  const next=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
  setTheme(next);renderSettings();
}
function copySessionId(){
  if(!currentSessionId)return;
  if(navigator.clipboard)navigator.clipboard.writeText(currentSessionId);
  closeSettings();
}

// 点遮罩关闭设置
settingsModal.addEventListener('click',e=>{if(e.target===settingsModal)closeSettings();});

// Esc 依次关闭：设置 → 历史 → 斜杠菜单
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(settingsModal.classList.contains('show')){closeSettings();return;}
  if(historyPanel.classList.contains('show')){closeHistory();return;}
  if(slashMenu.classList.contains('show')){hideSlashMenu();}
});

// 会话搜索
searchInput.addEventListener('input',()=>{sessionQuery=searchInput.value;renderSessions();});
searchInput.addEventListener('keydown',e=>{
  if(e.key==='Escape'){searchInput.value='';sessionQuery='';renderSessions();searchInput.blur();}
});
document.getElementById('settings-btn').addEventListener('click',openSettings);

// ─── Start ───
connect();inputEl.focus();
</script>
</body>
</html>
